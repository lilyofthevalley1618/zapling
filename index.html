  bbloop: { term: 'LED loop', art: 'bbled', def: '+ rail → resistor → LED anode → LED cathode → − rail. Current is the same all the way around.', lesson: 'L22' },
  ledr: { term: 'R = (Vs − Vf) ÷ I', art: 'bbres', def: 'The LED resistor formula. Example: (9 V − 2 V) ÷ 0.02 A = 350 Ω, so pick the next standard value up, 390 Ω.', lesson: 'L23' },
  stdval: { term: 'Standard resistor values', art: 'bbres', def: 'Resistors come in set steps (like 100, 220, 330, 470, 680, 1k). Round UP to the next one so the current stays safe.', lesson: 'L23' },
  spst: { term: 'SPST switch', art: 'bbsw', def: 'Single pole, single throw: one path that is either on or off.', lesson: 'L24' },
  spdt: { term: 'SPDT switch', art: 'bbsw', def: 'Single pole, double throw: 3 legs. The common leg connects to one of two other legs, so it picks between two paths.', lesson: 'L24' },
  pushb: { term: 'Pushbutton (momentary)', art: 'bbbtn', def: 'A switch that connects only while you hold it down, like a doorbell.', lesson: 'L24' },
  ledser: { term: 'LEDs in series', art: 'bbled', def: 'One path: same current through each LED, and their forward voltages add up. R = (Vs − ΣVf) ÷ I.', lesson: 'L25' },
  ledpar: { term: 'LEDs in parallel', art: 'bbled', def: 'Separate branches, each LED with its own resistor. Branch currents add up at the battery.', lesson: 'L25' },
  mah: { term: 'mAh (capacity)', art: 'bbbat', def: 'How much charge a battery holds. Runtime ≈ capacity ÷ current, e.g. 2000 mAh ÷ 20 mA ≈ 100 hours.', lesson: 'L26' },
  cellpack: { term: 'Battery pack', art: 'bbbat', def: 'Cells in series add voltage (4 × AA = 6 V). Cells in parallel keep the voltage but add capacity.', lesson: 'L26' },
  vprobe: { term: 'Measuring voltage', art: 'bbmeter', def: 'Put the probes ACROSS the part (in parallel), red on the higher side. The circuit stays as it is.', lesson: 'L27' },
  iprobe: { term: 'Measuring current', art: 'bbmeter', def: 'Break the loop and put the meter IN SERIES so the current flows through it.', lesson: 'L27' },
  contin: { term: 'Continuity mode', art: 'bbmeter', def: 'A meter mode that beeps when two points are connected. Use it with the power OFF.', lesson: 'L27' },
  dbglist: { term: 'Debug checklist', art: 'bbbug', def: 'Power → ground → rows (off by one?) → polarity → split rails. Then measure voltages along the loop.', lesson: 'L28' },
  offby1: { term: 'Off-by-one row', art: 'bbstrip', def: 'The most common breadboard mistake: a leg one row away from where it should be, so the loop is open.', lesson: 'L28' },
  pot: { term: 'Potentiometer', art: 'bbpot', def: 'A 3-leg variable resistor. The outer legs are the ends of a resistive track; the middle leg (wiper) slides along it.', lesson: 'L29' },
  wiper: { term: 'Wiper', art: 'bbpot', def: 'The middle leg of a pot. Using one end + the wiper gives a variable resistor; using all 3 legs gives a voltage divider.', lesson: 'L29' },
  ldr: { term: 'LDR (photoresistor)', art: 'bbldr', def: 'A resistor that changes with light: low (about 1 kΩ) in bright light, high (100 kΩ or more) in the dark.', lesson: 'L30' },
  sdiv: { term: 'Sensor divider', art: 'bbldr', def: 'A sensor plus a fixed resistor between + and −. Vout = Vs × R_bottom ÷ (R_top + R_bottom) changes with the sensor.', lesson: 'L30' },
  ibudget: { term: 'Current budget', art: 'bbbat', def: 'Add up every branch\'s current to get the battery current, then estimate runtime from the mAh rating.', lesson: 'L31' },
  halfsplit: { term: 'Half-splitting', art: 'bbbug', def: 'Measure in the middle of the circuit first. Whichever half has the problem, test its middle next.', lesson: 'L32' },
});

/* ---------- lessons ---------- */
Object.assign(LESSONS, {
  L18: { title: 'Inside a breadboard', goal: 'Learn which holes are connected: strips, rows and the center gap.', cards: ['tstrip', 'cgap', 'bbshort'], steps: [
    cpt('Building without solder', `<p class="body">A <b>breadboard</b> has metal clips hidden under its holes. Push a leg in and the clip grabs it.</p><div class="def">Each <b>numbered row</b> has two <b>terminal strips</b>: holes <b>a–e</b> are one strip, holes <b>f–j</b> are another (shaded).<br>The <b>center gap</b> keeps those two halves apart.</div>`, bbArt([], { strips: true }), 'Legs in the same strip are connected. Legs in different strips are not, unless a part or wire joins them.'),
    bbq('b18q1', 'view', 'Explore: <b>tap any holes</b> to see which ones are connected underneath.', 'Every hole in a 5-hole strip is joined. The rails along the edges run the whole length of the board.', { strips: true }),
    bbq('b18q2', 'holes', 'The glowing hole is <b>b4</b>. Tap a <b>different hole connected to it</b>.', 'b4 sits in the a–e strip of row 4, so a4, c4, d4 and e4 are all connected to it.', { ref: 'b4', strips: true, answer: 'a4, c4, d4 or e4' }),
    bbq('b18q3', 'holes', 'No shading this time. Tap <b>two holes</b> connected to <b>h9</b>.', 'h9 is in the f–j strip of row 9: f9, g9, i9 and j9. The a–e holes of row 9 are across the gap, so they don\'t count.', { ref: 'h9', need: 2, answer: 'Two of f9, g9, i9, j9' }),
    mcq('b18q4', 'Are holes <b>e3</b> and <b>f3</b> connected?', ['No: the center gap separates a–e from f–j', 'Yes: same row number means connected', 'Only while the battery is on'], 'The gap splits each numbered row into two separate strips. e3 is in the top strip, f3 in the bottom one.'),
    tfq('b18q5', 'Holes a7 and a8 are connected because they sit next to each other in line "a".', false, 'Connections run along each numbered row (a7–e7), not along the lettered lines. a7 and a8 are in different strips.'),
    mcq('b18q6', 'You push a resistor\'s legs into <b>b12</b> and <b>d12</b>. What happens?', ['Both legs are in the same strip, so the resistor is bypassed and does nothing', 'It works normally', 'It burns out right away'], 'b12 and d12 share one strip, so current takes the metal clip instead of the resistor. Each leg of a part needs its own strip.'),
    bbq('b18q7', 'holes', 'Tap a hole that is <b>NOT</b> connected to <b>c6</b> but is in <b>row 6</b>.', 'Only the f–j holes of row 6 are in row 6 yet separate from c6, thanks to the center gap.', { ref: 'c6', okHole: h => /^[f-j]6$/.test(h), answer: 'f6, g6, h6, i6 or j6' }),
  ] },
  L19: { title: 'Power rails & ground', goal: 'Use the + and − rails, find ground, and fix split rails.', cards: ['prail', 'gnd0', 'splitr'], steps: [
    cpt('Rails carry the power', `<p class="body">The long strips along the edges are the <b>power rails</b>. Here the battery feeds the <b>top</b> rails: <b style="color:var(--corald)">+</b> (red line) and <b style="color:var(--perid)">−</b> (blue line).</p><div class="def">We call the − side <b>ground</b>: the <b>0 V</b> reference. Every loop has to make it back there.</div>`, bbArt([], {})),
    bbq('b19q1', 'holes', 'Tap any hole that carries the battery\'s <b>+ 9 V</b>.', 'The battery\'s red wire feeds the top + rail, so every hole along that red-line rail is at +9 V.', { okHole: h => h.startsWith('T+'), answer: 'Any hole on the top + rail' }),
    bbq('b19q2', 'holes', 'Now tap a hole on <b>ground</b> (the battery\'s − side).', 'The black wire feeds the top − rail (blue line). That\'s ground, 0 V.', { okHole: h => h.startsWith('T-'), answer: 'Any hole on the top − rail' }),
    mcq('b19q3', 'Nothing is plugged into the <b>bottom</b> rails yet. A bottom + rail hole is at…', ['Nothing: it isn\'t connected until you add jumpers', '+9 V, because all rails are linked inside', '0 V, because it\'s ground'], 'The bottom rails are separate strips. Link them to the top rails with jumpers if you want power down there too.'),
    cpt('Watch out for split rails', `<p class="body">On many full-size boards each rail is <b>split in the middle</b>: notice the break in the lines.</p><div class="def">The right half has <b>no power</b> until you add a jumper across the break.</div>`, bbArt([], { split: true })),
    bbq('b19q4', 'holes', 'This board has <b>split rails</b>. Tap a <b>+ rail</b> hole that has <b>no power</b>.', 'The battery feeds the left half. Holes 8–15 on the + rail are on the other side of the break, so they\'re dead.', { split: true, okHole: h => /^T\+(8|9|1[0-5])$/.test(h), answer: 'A + rail hole in columns 8–15' }),
    bbq('b19q5', 'place', 'The LED circuit sits on the dead half. <b>Add one jumper</b> so it lights.', 'Bridge the break: a jumper from any + hole on the left half to the right half. The ground jumper already goes to the powered half.', { split: true, parts: [W('j1', 'T+10', 'a10', RED, 'the red jumper'), RS('r1', 'c10', 'c13', 470), LD('d1', 'e13', 'e14'), W('j2', 'a14', 'T-6', BLK, 'the black jumper')], place: { id: 'jx', kind: 'wire', color: YEL, label: 'jumper' }, answer: 'A jumper across the break in the + rail (e.g. T+5 to T+9)' }),
    tfq('b19q6', 'Ground is just a name for the 0 V reference point, usually the battery\'s − side.', true, 'Exactly. Voltages are measured relative to ground.'),
    mcq('b19q7', 'You plug a jumper from the + rail straight into the − rail. What happens?', ['A short circuit: a huge current and a hot battery', 'Nothing, the rails are insulated', 'Every LED gets brighter'], 'A bare wire across the battery has almost no resistance, so the current is enormous. Never bridge + to − directly.'),
  ] },
  L20: { title: 'Jumpers, pins & headers', goal: 'Wire rows to rails, read pin spacing, and seat chips.', cards: ['jumper', 'header', 'dip'], steps: [
    cpt('Jumper wires', `<p class="body"><b>Jumper wires</b> link holes: rail to row, row to row.</p><div class="def">Color is just a label: <b style="color:var(--corald)">red</b> for +, <b>black</b> or blue for −, other colors for signals. Keep them short and flat so you can see your parts.</div>`, bbArt(STD(), {})),
    cpt('Pins, headers and chips', `<p class="body">Breadboard holes are <b>2.54 mm (0.1 in)</b> apart, the same as <b>pin headers</b> and chip legs.</p><div class="def">A <b>DIP chip</b> straddles the <b>center gap</b>. That way each pin lands in its own strip instead of being joined to the pin opposite.</div>`, CARDART.bbchip),
    bbq('b20q1', 'place', 'This circuit has no power. <b>Add a jumper</b> from the + rail to <b>row 3</b>.', 'The resistor starts in row 3, so a jumper from any + rail hole to a3–e3 completes the loop.', { parts: [RS('r1', 'c3', 'c7', 470), LD('d1', 'e7', 'e8'), W('j2', 'a8', 'T-8', BLK, 'the black jumper')], place: { id: 'jx', kind: 'wire', color: RED, label: 'red jumper' }, answer: 'A jumper from the + rail to any free hole in row 3' }),
    mcq('b20q2', 'Standard header pins are spaced…', ['2.54 mm (0.1 inch)', '5 mm', '1 cm'], '0.1 in = 2.54 mm: the breadboard grid, header pins and DIP chips all share it.'),
    mcq('b20q3', 'Why does a DIP chip sit <b>across the center gap</b>?', ['So each pin gets its own strip instead of being shorted to the pin opposite', 'To keep the chip cool', 'So it can reach both power rails'], 'If both rows of pins sat in the same strips, opposite pins would be connected together.'),
    bbq('b20q4', 'place', 'Add the <b>ground jumper</b> to finish this loop.', 'The LED\'s − leg is in row 7. A jumper from row 7 to the − rail lets current return to the battery.', { parts: STDNO('j2'), place: { id: 'jx', kind: 'wire', color: BLK, label: 'black jumper' }, answer: 'A jumper from row 7 (a7–d7) to the − rail' }),
    tfq('b20q5', 'A red jumper wire carries current better than a black one.', false, 'Color is only insulation. Every jumper conducts the same; colors just help you read the board.'),
    { type: 'order', id: 'b20q6', q: 'Put a clean build in order.', items: ['Plan from the schematic', 'Connect the battery to the rails (switched off)', 'Plug in the parts', 'Add the jumper wires', 'Check everything, then power on'], why: 'Plan first, power last. Building with the power off avoids accidental shorts.' },
  ] },
  L21: { title: 'LEDs: anode & cathode', goal: 'Plug LEDs in the right way round.', cards: ['anode', 'cathode', 'fwdv'], steps: [
    cpt('One-way light', `<p class="body">An LED only lets current through <b>one way</b>: in at the <b>anode (+)</b>, out at the <b>cathode (−)</b>.</p><div class="def"><b>Anode</b>: the <b>longer</b> leg, toward +.<br><b>Cathode</b>: the <b>shorter</b> leg, by the <b>flat edge</b> of the rim, toward −.<br>Backwards = dark (no damage at these low voltages).</div>`, bbArt(STD(), {}), 'The little + on the board marks the anode leg.'),
    mcq('b21q1', 'Which leg of a brand-new LED is the anode?', ['The longer leg', 'The shorter leg', 'The leg by the flat edge'], 'Long leg = anode (+). The short leg by the flat edge is the cathode (−).'),
    bbq('b21q2', 'place', 'Plug in the LED. Tap a hole for its <b>+ leg</b> first, then its <b>− leg</b>.', 'Current comes from the resistor in row 6, so the anode goes in row 6 and the cathode in row 7, where the black jumper returns to −.', { parts: STDNO('d1'), place: { id: 'd1', kind: 'led', color: 'red', label: 'LED' }, answer: '+ leg in row 6, − leg in row 7' }),
    bbq('b21q3', 'fix', 'This LED stays dark. <b>Tap the part that\'s in wrong.</b>', 'The LED\'s anode is in row 7 (the ground side) and its cathode in row 6. It\'s backwards, so no current flows.', { parts: [W('j1', 'T+2', 'a2', RED, 'the red jumper'), RS('r1', 'c2', 'c6', 470), LD('d1', 'e7', 'e6'), W('j2', 'a7', 'T-7', BLK, 'the black jumper')], answerId: 'd1', answer: 'The LED: it\'s in backwards' }),
    tfq('b21q4', 'Current flows through an LED from the cathode to the anode.', false, 'It\'s anode → cathode, + to −.'),
    bbq('b21q5', 'place', '<b>No preview this time.</b> The resistor ends in row 9 and the ground jumper starts in row 11. Plug the LED in so it will light.', 'Anode in row 9 (the resistor\'s row), cathode in row 11 (the ground jumper\'s row). Each leg in its own strip, + toward the resistor.', { blind: true, parts: [W('j1', 'T+3', 'a3', RED, 'the red jumper'), RS('r1', 'c3', 'c9', 1000), W('j2', 'a11', 'T-11', BLK, 'the black jumper')], place: { id: 'd1', kind: 'led', color: 'green', label: 'LED' }, answer: '+ leg in row 9, − leg in row 11' }),
    mcq('b21q6', 'A blue LED needs about 3 V. Will it light from a single 1.5 V AA cell?', ['No: 1.5 V is below its forward voltage', 'Yes, just more dimly', 'Yes, at full brightness'], 'Below its forward voltage an LED passes almost no current, so it stays dark.'),
  ] },
  L22: { title: 'Your first LED circuit', goal: 'Build a complete, safe LED loop from scratch.', cards: ['limr', 'bbloop'], steps: [
    cpt('Why the resistor?', `<p class="body">Once an LED turns on it has very little resistance. On its own it would pull a huge current and <b>burn out</b>.</p><div class="def">A <b>current-limiting resistor</b> in series keeps the current around <b>10–20 mA</b>.<br>The loop: <b>+ rail → resistor → LED → − rail</b>.</div>`, bbArt(STD(), {})),
    bbq('b22q1', 'place', 'The jumpers are in. Place the <b>470 Ω resistor</b> (row 2 → row 6), then the <b>LED</b> (row 6 → row 7).', 'Resistor from the + jumper\'s row to the LED\'s row, then the LED anode in that row and its cathode in the ground jumper\'s row.', { parts: [W('j1', 'T+2', 'a2', RED, 'the red jumper'), W('j2', 'a7', 'T-7', BLK, 'the black jumper')], place: [{ id: 'r1', kind: 'res', ohms: 470, label: '470 Ω resistor' }, { id: 'd1', kind: 'led', color: 'green', label: 'LED' }], answer: 'Resistor row 2 → row 6, LED + in row 6, − in row 7' }),
    mcq('b22q2', 'Someone built this. What happened?', ['No resistor: too much current burned out the LED', 'The LED is backwards', 'The battery is flat'], 'The LED goes straight from the + jumper\'s row to the ground row with nothing to limit the current.', bbArt([W('j1', 'T+2', 'a2', RED), LD('d1', 'e2', 'e3'), W('j2', 'a3', 'T-3', BLK)], {})),
    { type: 'order', id: 'b22q3', q: 'Trace the current through the standard build.', art: bbArt(STD(), {}), items: ['+ rail', 'Red jumper', 'Resistor', 'LED (anode → cathode)', 'Black jumper', '− rail'], why: 'Out of the + rail, through each part in turn, back into the − rail.' },
    mcq('b22q4', 'Does the resistor have to go on the + side of the LED?', ['No: in a series loop the same current flows everywhere, so either side works', 'Yes, always before the LED', 'No, it must go after the LED'], 'In one loop, the order of series parts doesn\'t change the current.'),
    bbq('b22q5', 'place', '<b>Build it all, no preview.</b> Only the resistor is in (row 4 → row 8). Add the + jumper, the LED and the ground jumper.', 'Red jumper from + to row 4, LED + leg in row 8 and − leg in a new row, then a black jumper from that row to −.', { blind: true, parts: [RS('r1', 'c4', 'c8', 470)], place: [{ id: 'jx', kind: 'wire', color: RED, label: 'red jumper' }, { id: 'd1', kind: 'led', color: 'yellow', label: 'LED' }, { id: 'jy', kind: 'wire', color: BLK, label: 'black jumper' }], answer: '+ rail → row 4; LED + in row 8, − in row 9; row 9 → − rail' }),
    tfq('b22q6', 'If the LED is lit, current is flowing through both jumper wires.', true, 'It\'s one series loop, so the same current passes through every part, jumpers included.'),
  ] },
  L23: { title: 'Choosing the LED resistor', goal: 'Calculate and pick the right resistor value.', cards: ['ledr', 'stdval'], steps: [
    cpt('R = (Vs − Vf) ÷ I', `<p class="body">The resistor takes whatever voltage the LED doesn't use.</p><div class="def"><b>R = (V<sub>supply</sub> − V<sub>f</sub>) ÷ I</b><br>9 V, red LED (2 V), 20 mA: (9 − 2) ÷ 0.02 = <b>350 Ω</b> → round <b>up</b> to the standard <b>390 Ω</b>.</div>`, CARDART.bbres, 'Typical LED currents are 5–20 mA. Rounding up keeps you on the safe side.'),
    mcq('b23q1', '5 V supply, red LED (2 V), target 15 mA. Resistor?', ['200 Ω', '333 Ω', '75 Ω'], '(5 − 2) ÷ 0.015 = 200 Ω.'),
    mcq('b23q2', '9 V supply, blue LED (3 V), target 10 mA. Which standard resistor?', ['680 Ω', '560 Ω', '220 Ω'], '(9 − 3) ÷ 0.01 = 600 Ω. Round up to 680 Ω so the current stays under 10 mA.'),
    bbq('b23q3', 'slider', 'Slide through the resistor drawer. Pick one that puts <b>8–20 mA</b> through the LED.', '9 V − 2 V = 7 V across the resistor. 470 Ω gives about 14 mA. 220 Ω gives about 29 mA (too much), and 1 kΩ only about 7 mA.', { parts: [W('j1', 'T+2', 'a2', RED), RS('r1', 'c2', 'c6', 47), LD('d1', 'e6', 'e7'), W('j2', 'a7', 'T-7', BLK)], slider: { part: 'r1', prop: 'ohms', values: [47, 100, 220, 470, 1000, 4700, 10000], label: 'Resistor value', lo: '47 Ω', hi: '10 kΩ', fmt: v => 'Resistor: ' + ohmsTxt(v) }, readout: (sol) => `LED current: <b>${ledI(sol, 'd1').toFixed(1)} mA</b>${ledState(sol, 'd1') === 'burnt' ? ' · burned out!' : ''}`, ok: sol => { const i = ledI(sol, 'd1'); return i >= 8 && i <= 20; }, answer: '470 Ω (about 14 mA)' }),
    mcq('b23q4', '12 V supply, green LED (2.2 V), 20 mA. You pick 560 Ω. About how much power does the resistor burn?', ['About 0.17 W: a ¼ W resistor is fine', 'About 1.7 W: it needs a big resistor', 'About 0.017 W'], 'I ≈ 9.8 V ÷ 560 Ω ≈ 17.5 mA. P = V × I ≈ 9.8 × 0.0175 ≈ 0.17 W, under ¼ W.'),
    tfq('b23q5', 'Using a smaller resistor than calculated makes the LED last longer.', false, 'Smaller R means more current. That makes it brighter but hotter, and it wears out sooner or burns out.'),
    mcq('b23q6', '6 V pack, two red LEDs (2 V each) in series, 10 mA. Resistor?', ['200 Ω', '400 Ω', '600 Ω'], '(6 − 2 − 2) ÷ 0.01 = 200 Ω. In series, the forward voltages add.'),
  ] },
  L24: { title: 'Switches & pushbuttons', goal: 'Control LEDs with SPST, SPDT and momentary switches.', cards: ['spst', 'spdt', 'pushb'], steps: [
    cpt('Three kinds of switch', `<p class="body">A switch opens or closes a path.</p><div class="def"><b>SPST</b>: one path, on or off.<br><b>Pushbutton</b>: momentary, closed only while held.<br><b>SPDT</b>: 3 legs; the <b>common</b> leg connects to <b>one of two</b> others, so it chooses a path.</div>`, CARDART.bbsw),
    bbq('b24q1', 'toggle', '<b>Tap the pushbutton</b> to press it and light the LED. Press Check while it\'s lit.', 'The button bridges row 2 (power) and row 5 (the resistor). Pressed = closed loop = light.', { parts: [W('j1', 'T+2', 'a2', RED), { id: 'b1', kind: 'btn', a: 'c2', b: 'c5', on: false, name: 'the pushbutton' }, RS('r1', 'd5', 'd9', 470), LD('d1', 'e9', 'e10'), W('j2', 'a10', 'T-10', BLK)], ok: sol => ledState(sol, 'd1') === 'lit', answer: 'Press the button so the LED lights' }),
    bbq('b24q2', 'toggle', 'The SPDT switch picks a path. Set it so the <b>green LED is on and the red one is off</b>.', 'The common leg (row 7) gets +. Sliding the switch connects it to row 8, which feeds the green branch.', { parts: SPDT(), ok: sol => ledState(sol, 'd2') === 'lit' && ledState(sol, 'd1') === 'dark', answer: 'Slide the switch toward row 8' }),
    mcq('b24q3', 'A doorbell button is…', ['Momentary: on only while pressed', 'Latching: it stays on', 'An SPDT switch'], 'Release it and the contact springs open again.'),
    mcq('b24q4', 'How many legs does an SPDT switch need?', ['3: common plus two throws', '2', '4'], 'Common + throw A + throw B.'),
    tfq('b24q5', 'To control an LED, a switch goes in series with it.', true, 'In series, opening the switch breaks the loop.'),
    mcq('b24q6', 'You wire a pushbutton <b>across</b> the LED\'s two legs (in parallel). Pressing it…', ['Turns the LED off by bypassing it', 'Turns the LED on', 'Burns the LED out'], 'The button gives current an easier path around the LED. The resistor still limits the current, so nothing burns.'),
  ] },
  L25: { title: 'LEDs in series & parallel', goal: 'Run several LEDs from one battery.', cards: ['ledser', 'ledpar'], steps: [
    cpt('Series or parallel LEDs?', `<p class="body"><b>Series</b>: one path, same current; forward voltages <b>add</b> (3 red LEDs = 6 V). The supply must be higher than the total.</p><div class="def"><b>Parallel</b>: each LED in its <b>own branch with its own resistor</b>. The branch currents add up at the battery.</div>`, CARDART.bbled),
    mcq('b25q1', '9 V, two red LEDs (2 V each) in series, 10 mA. Resistor?', ['500 Ω', '700 Ω', '250 Ω'], '(9 − 4) ÷ 0.01 = 500 Ω.'),
    mcq('b25q2', 'Three blue LEDs (3 V each) in series on a 9 V battery…', ['Barely light, if at all: 9 V leaves nothing for a resistor', 'Light brightly', 'Each gets the full 9 V'], '3 × 3 V = 9 V, the whole supply. No headroom means almost no current, and no room for a resistor.'),
    bbq('b25q3', 'place', 'Add a <b>second LED</b> in its own branch (bottom half). Its resistor ends in row 8 and its ground jumper starts in row 9.', 'Branch 2: + crosses the gap in row 2, through R2 to row 8, LED anode in row 8, cathode in row 9, back to the bottom − rail.', { bottom: true, parts: [W('j1', 'T+2', 'a2', RED), RS('r1', 'c2', 'c6', 470), LD('d1', 'e6', 'e7', 'green'), W('j2', 'a7', 'T-7', BLK), W('jx', 'e2', 'f2', YEL), RS('r2', 'h2', 'h8', 470), W('j3', 'g9', 'B-9', BLK)], place: { id: 'd2', kind: 'led', color: 'yellow', label: 'second LED' }, answer: 'LED + leg in row 8 (f–j side), − leg in row 9' }),
    tfq('b25q4', 'Two LEDs in parallel can safely share ONE resistor.', false, 'Their forward voltages differ slightly, so one LED hogs the current. Give each branch its own resistor.'),
    mcq('b25q5', 'Three parallel LED branches each draw 15 mA. The battery supplies…', ['45 mA', '15 mA', '5 mA'], 'Parallel branch currents add: 3 × 15 = 45 mA.'),
    mcq('b25q6', '12 V, four red LEDs (2 V) in series at 20 mA. Resistor?', ['200 Ω', '400 Ω', '600 Ω'], '(12 − 8) ÷ 0.02 = 200 Ω.'),
  ] },
  L26: { title: 'Battery packs & power', goal: 'Pick a power source and estimate how long it lasts.', cards: ['mah', 'cellpack'], steps: [
    cpt('Volts and capacity', `<p class="body">An AA cell is <b>1.5 V</b>. Cells in <b>series</b> add voltage: 4 × AA = <b>6 V</b>. Cells in <b>parallel</b> keep the voltage but add <b>capacity</b>.</p><div class="def">Capacity is in <b>mAh</b>. Runtime ≈ <b>capacity ÷ current</b>. A 9 V battery holds about 500 mAh; an AA about 2000 mAh. USB gives 5 V.</div>`, CARDART.bbbat),
    mcq('b26q1', 'Four AA cells in series give…', ['6 V', '1.5 V', '3 V'], '4 × 1.5 V = 6 V.'),
    mcq('b26q2', 'A 2000 mAh pack runs a circuit drawing 25 mA. About how long does it last?', ['About 80 hours', 'About 8 hours', 'About 800 hours'], '2000 ÷ 25 = 80 hours (a little less in practice).'),
    bbq('b26q3', 'fix', 'The LED is dark and the battery is getting <b>hot</b>. Tap the part causing it.', 'The yellow jumper connects the + rail straight to the − rail: a short circuit. Almost all the current rushes through it.', { parts: STD().concat([W('jx', 'T+12', 'T-12', YEL, 'the yellow jumper')]), answerId: 'jx', answer: 'The yellow jumper from + to −' }),
    tfq('b26q4', 'Two identical cells in parallel give double the voltage.', false, 'Parallel keeps the voltage the same and adds capacity. Series adds voltage.'),
    mcq('b26q5', 'A 9 V battery (500 mAh) powers a circuit drawing 50 mA. Runtime?', ['About 10 hours', 'About 100 hours', 'About 1 hour'], '500 ÷ 50 = 10 hours.'),
    mcq('b26q6', '3 × AA in series drives a red LED (2 V) at 10 mA. Resistor?', ['250 Ω', '450 Ω', '200 Ω'], '3 × 1.5 = 4.5 V. (4.5 − 2) ÷ 0.01 = 250 Ω.'),
  ] },
  L27: { title: 'Multimeter on the breadboard', goal: 'Measure voltages on a live breadboard.', cards: ['vprobe', 'iprobe', 'contin'], steps: [
    cpt('Probing a breadboard', `<p class="body">To measure <b>voltage</b>, touch the probes to holes in the strips on each side of a part: <b>across</b> it, red on the higher side.</p><div class="def"><b>Current</b>: break the loop and put the meter <b>in series</b>.<br><b>Resistance / continuity</b>: power <b>off</b> first.</div>`, CARDART.bbmeter),
    bbq('b27q1', 'meter', 'Measure the voltage <b>across the resistor</b>. Tap a hole for the red probe, then one for the black probe.', 'The resistor spans row 2 to row 6. Red in row 2 (higher side), black in row 6: about 6.6 V.', { parts: STD(), want: ['c2', 'c6'], answer: 'Red probe in row 2, black probe in row 6' }),
    bbq('b27q2', 'meter', 'Now measure <b>across the LED</b>.', 'The LED spans rows 6 and 7. Red in row 6, black in row 7: about 2.4 V, its forward voltage.', { parts: STD(), want: ['e6', 'e7'], answer: 'Red probe in row 6, black probe in row 7' }),
    mcq('b27q3', 'The meter shows 6.6 V across the 470 Ω resistor. What\'s the current?', ['About 14 mA', 'About 1.4 A', 'About 3 mA'], 'I = V ÷ R = 6.6 ÷ 470 ≈ 0.014 A = 14 mA.'),
    bbq('b27q4', 'meter', 'Find two spots that read the <b>full battery voltage</b> (about 9 V).', 'Anything connected to + versus anything connected to −: the + rail or row 2 against the − rail or row 7.', { parts: STD(), ok: r => r > 8.9, answer: 'Red on the + rail (or row 2), black on the − rail (or row 7)' }),
    tfq('b27q5', 'To measure the LED current, put the meter probes across the LED\'s legs.', false, 'Across = voltage. For current, the loop must run through the meter, in series.'),
    mcq('b27q6', 'Continuity (beep) mode should be used…', ['With the power off', 'Only while the circuit runs', 'Across the battery'], 'Continuity sends its own small current. Live voltages give false readings or can damage the meter.'),
  ] },
  L28: { title: 'Debugging breadboard builds', goal: 'Find wrong rows, split rails, backwards LEDs and missing grounds.', cards: ['dbglist', 'offby1'], steps: [
    cpt('A debug checklist', `<p class="body">When it doesn't work, check in order:</p><div class="def">1. <b>Power</b>: battery on the rails?<br>2. <b>Ground</b>: does the loop return to −?<br>3. <b>Rows</b>: every leg in the intended strip (off by one)?<br>4. <b>Polarity</b>: LEDs the right way round?<br>5. <b>Split rails</b> bridged?</div>`, CARDART.bbbug),
    bbq('b28q1', 'fix', 'Plan: resistor from row 2 to row 6, LED from row 6 to row 7. Something is <b>off by one</b>. Tap it.', 'The LED\'s + leg is in row 5, not row 6, so nothing connects it to the resistor. The loop is open.', { parts: [W('j1', 'T+2', 'a2', RED, 'the red jumper'), RS('r1', 'c2', 'c6', 470), LD('d1', 'e5', 'e7'), W('j2', 'a7', 'T-7', BLK, 'the black jumper')], answerId: 'd1', answer: 'The LED: its + leg is in row 5' }),
    bbq('b28q2', 'place', 'The LED\'s − row (row 7) goes nowhere. <b>Add the missing ground</b>.', 'Current has to return to the battery. A jumper from row 7 to the − rail closes the loop.', { parts: STDNO('j2'), place: { id: 'jx', kind: 'wire', color: BLK, label: 'ground jumper' }, answer: 'A jumper from row 7 to the − rail' }),
    mcq('b28q3', 'Why is this LED dark?', ['The rails are split: the build\'s half has no power', 'The LED is backwards', 'The resistor is too big'], 'Everything is on the right half, past the break. Bridge both rails across the break.', bbArt([W('j1', 'T+10', 'a10', RED), RS('r1', 'c10', 'c13', 470), LD('d1', 'e13', 'e14'), W('j2', 'a14', 'T-14', BLK)], { split: true })),
    bbq('b28q4', 'fix', 'This build has the resistor and LED in different rows. It\'s still dark. Tap the faulty part.', 'The LED\'s + leg is in row 10 (the ground row) and its − leg is in row 9 (the resistor\'s row): it\'s reversed, so it blocks the current.', { parts: [W('j1', 'T+4', 'a4', RED, 'the red jumper'), RS('r1', 'c4', 'c9', 1000), LD('d1', 'e10', 'e9', 'green'), W('j2', 'a10', 'T-10', BLK, 'the black jumper')], answerId: 'd1', answer: 'The LED: it\'s backwards' }),
    mcq('b28q5', 'The LED is dark. You measure the full 9 V across the LED\'s legs and 0 V across the resistor. Most likely…', ['The LED is backwards (or dead): no current flows', 'The battery is flat', 'The ground jumper is missing'], 'No current means no drop across the resistor, so the LED sees the whole battery voltage. A blocking LED is the culprit.'),
    { type: 'order', id: 'b28q6', q: 'Order your debugging steps.', items: ['Check the battery and rail connections', 'Check the ground return to −', 'Check each leg is in the right row', 'Check LED polarity', 'Measure voltages along the loop'], why: 'Start with the big, easy things (power and ground), then rows and polarity, then measure.' },
  ] },
  L29: { title: 'Potentiometers & dimmers', goal: 'Use a pot as a dimmer and as a voltage divider.', cards: ['pot', 'wiper'], steps: [
    cpt('Meet the potentiometer', `<p class="body">A <b>pot</b> has 3 legs: two ends of a resistive track and a <b>wiper</b> in the middle that slides along it.</p><div class="def"><b>End + wiper</b>: a variable resistor (a <b>dimmer</b>).<br><b>All 3 legs</b>: a voltage divider.<br>Keep a <b>fixed resistor</b> in series so the LED is safe at the 0 Ω end.</div>`, CARDART.bbpot),
    bbq('b29q1', 'slider', 'Turn the dimmer until the LED current is <b>8–12 mA</b>.', 'Current = 7 V ÷ (220 Ω + the pot\'s part). For 8–12 mA the total should be about 580–875 Ω, so the pot section is about 350–650 Ω.', { parts: [W('j1', 'T+2', 'a2', RED), { id: 'p1', kind: 'pot', a: 'd2', w: 'd3', b: 'd4', ohms: 1000, pos: 1, name: 'the pot' }, RS('r1', 'a3', 'a7', 220), LD('d1', 'e7', 'e8'), W('j2', 'a8', 'T-8', BLK)], slider: { part: 'p1', prop: 'pos', min: 0, max: 1, step: .01, label: 'Dimmer knob', lo: '0 Ω', hi: '1 kΩ', fmt: v => `Pot section: ${Math.round(v * 1000)} Ω` }, readout: sol => `LED current: <b>${ledI(sol, 'd1').toFixed(1)} mA</b>`, ok: sol => { const i = ledI(sol, 'd1'); return i >= 8 && i <= 12; }, answer: 'Pot section about 350–650 Ω' }),
    mcq('b29q2', 'Why keep the fixed 220 Ω resistor in series with the dimmer?', ['At the pot\'s 0 Ω end it still limits the current', 'It makes the LED brighter', 'Pots only work next to resistors'], 'Turn the pot all the way down and only the fixed resistor protects the LED.'),
    mcq('b29q3', 'A 10 kΩ pot\'s wiper is 30% of the way from end A. Resistance A→wiper and wiper→B?', ['3 kΩ and 7 kΩ', '7 kΩ and 3 kΩ', '10 kΩ and 0 Ω'], 'The track splits at the wiper: 30% of 10 kΩ = 3 kΩ, the rest is 7 kΩ.'),
    bbq('b29q4', 'slider', 'Now the pot is a <b>voltage divider</b> (ends on + and −). Set the wiper to <b>2.8–3.2 V</b>.', 'The wiper voltage = 9 V × (lower section ÷ 10 kΩ). For 3 V the knob needs to be about two-thirds of the way toward the + end.', { parts: [W('j1', 'T+3', 'a3', RED), { id: 'p1', kind: 'pot', a: 'c3', w: 'c4', b: 'c5', ohms: 10000, pos: .2, name: 'the pot' }, W('j2', 'a5', 'T-5', BLK)], red: 'e4', black: 'T-9', slider: { part: 'p1', prop: 'pos', min: 0, max: 1, step: .01, label: 'Pot knob', lo: '9 V', hi: '0 V', fmt: v => `Knob: ${Math.round(v * 100)}%` }, readout: sol => `Meter (wiper to −): <b>${(sol.v('e4') - sol.v('T-9')).toFixed(2)} V</b>`, ok: sol => { const v = sol.v('e4'); return v >= 2.8 && v <= 3.2; }, answer: 'Knob at about 65–69%' }),
    tfq('b29q5', 'The middle leg of a potentiometer is the wiper.', true, 'Yes. The outer two are the ends of the track.'),
    mcq('b29q6', 'Dimmer: 9 V, red LED (2 V), fixed 330 Ω plus a 1 kΩ pot. Current range?', ['About 5 mA to 21 mA', 'About 0 to 27 mA', 'About 7 mA to 9 mA'], 'Max: 7 ÷ 330 ≈ 21 mA. Min: 7 ÷ 1330 ≈ 5.3 mA.'),
  ] },
  L30: { title: 'Light sensors: LDR dividers', goal: 'Turn light into a voltage with an LDR divider.', cards: ['ldr', 'sdiv'], steps: [
    cpt('A resistor that sees light', `<p class="body">An <b>LDR</b>'s resistance drops in bright light (about <b>1 kΩ</b>) and rises in the dark (<b>100 kΩ</b> or more).</p><div class="def">Pair it with a fixed resistor: <b>V<sub>out</sub> = V<sub>s</sub> × R<sub>bottom</sub> ÷ (R<sub>top</sub> + R<sub>bottom</sub>)</b>.<br>LDR on the <b>bottom</b>: V<sub>out</sub> <b>rises when it gets dark</b>: perfect for a night-light.</div>`, CARDART.bbldr),
    bbq('b30q1', 'slider', 'Fixed 10 kΩ on top, LDR on the bottom. Make it <b>dark enough</b> that V<sub>out</sub> goes <b>above 7 V</b>.', 'V_out = 9 × R_LDR ÷ (10k + R_LDR). At 50 kΩ it\'s 7.5 V; at 20 kΩ only 6 V.', { parts: [W('j1', 'T+3', 'a3', RED), RS('r1', 'c3', 'c7', 10000), { id: 'q1', kind: 'ldr', a: 'd7', b: 'd11', ohms: 1000, name: 'the LDR' }, W('j2', 'a11', 'T-11', BLK)], red: 'e7', black: 'T-13', slider: { part: 'q1', prop: 'ohms', values: [1000, 2000, 5000, 10000, 20000, 50000, 100000], label: 'Light level', lo: 'bright', hi: 'dark', fmt: v => 'LDR: ' + ohmsTxt(v) }, readout: sol => `V<sub>out</sub>: <b>${(sol.v('e7') - sol.v('T-13')).toFixed(2)} V</b>`, ok: sol => sol.v('e7') > 7, answer: 'Dark: LDR at 50 kΩ or more' }),
    mcq('b30q2', '5 V, 10 kΩ on top, LDR on the bottom reads 10 kΩ (dim room). V<sub>out</sub>?', ['2.5 V', '5 V', '1.25 V'], 'Equal resistors split the voltage in half: 2.5 V.'),
    mcq('b30q3', 'Same divider in bright light: the LDR drops to 1 kΩ. V<sub>out</sub>?', ['About 0.45 V', 'About 4.5 V', 'About 2.5 V'], '5 × 1 ÷ (10 + 1) ≈ 0.45 V.'),
    tfq('b30q4', 'An LDR\'s resistance goes up as it gets darker.', true, 'Less light, fewer free charges, more resistance.'),
    mcq('b30q5', 'To make V<sub>out</sub> RISE when it gets BRIGHTER, put the LDR…', ['On top (between + and V_out)', 'On the bottom (between V_out and ground)', 'Across the battery'], 'Bright light makes the top resistor small, so V_out moves up toward the supply.'),
    mcq('b30q6', '9 V divider: LDR on top, 4.7 kΩ on the bottom. V<sub>out</sub> reads 3 V. LDR resistance?', ['About 9.4 kΩ', 'About 4.7 kΩ', 'About 14 kΩ'], '3 = 9 × 4.7 ÷ (4.7 + R) → 4.7 + R = 14.1 → R ≈ 9.4 kΩ.'),
  ] },
  L31: { title: 'Capstone: indicator panel', goal: 'Plan, build and budget a multi-LED panel.', cards: ['ibudget'], steps: [
    cpt('Plan → build → test', `<p class="body">Real builds combine everything: a switch picks a status color, parallel branches each get a resistor, and you check the <b>current budget</b>.</p><div class="def">Battery current = sum of the branch currents. Runtime ≈ mAh ÷ total mA.</div>`, bbArt(SPDT(), {})),
    bbq('b31q1', 'place', '<b>No preview.</b> Both LEDs are in. Add the two resistors so both branches light (top: row 2 → row 7, bottom: row 2 → row 7).', 'Each branch needs its own resistor from the + row (row 2, both halves thanks to the yellow jumper) to its LED\'s + row (row 7).', { blind: true, bottom: true, parts: [W('j1', 'T+2', 'a2', RED), W('jx', 'e2', 'f2', YEL), LD('d1', 'e7', 'e8', 'green'), W('j2', 'a8', 'T-8', BLK), LD('d2', 'j7', 'j8', 'blue'), W('j3', 'g8', 'B-8', BLK)], place: [{ id: 'r1', kind: 'res', ohms: 470, label: 'top resistor' }, { id: 'r2', kind: 'res', ohms: 330, label: 'bottom resistor' }], answer: 'Top resistor row 2 → row 7 (a–e), bottom resistor row 2 → row 7 (f–j)' }),
    bbq('b31q2', 'toggle', 'Status panel: set it to <b>green = OK</b> (green on, red off).', 'Slide the SPDT so the common row 7 feeds row 8, the green branch.', { parts: SPDT(), ok: sol => ledState(sol, 'd2') === 'lit' && ledState(sol, 'd1') === 'dark', answer: 'Switch toward row 8' }),
    mcq('b31q3', 'Your panel has 3 LEDs at 12 mA each plus a 4 mA sensor, on a 500 mAh 9 V battery. Total current and runtime?', ['40 mA, about 12 hours', '12 mA, about 40 hours', '40 mA, about 1 hour'], '3 × 12 + 4 = 40 mA. 500 ÷ 40 ≈ 12.5 hours.'),
    mcq('b31q4', 'A 9 V loop has a green LED (2.2 V) and a 680 Ω resistor. The meter shows 6.8 V across the resistor. Current?', ['10 mA', '6.8 mA', '100 mA'], '6.8 ÷ 680 = 0.01 A = 10 mA. (And 6.8 + 2.2 = 9 V: the budget checks out.)'),
    tfq('b31q5', 'In a parallel LED panel, unplugging one LED turns all the others off.', false, 'Each branch is its own loop. The others keep working.'),
    { type: 'order', id: 'b31q6', q: 'Order the capstone workflow.', items: ['Draw the schematic', 'Calculate each resistor', 'Lay out rows and rails', 'Build with the power off', 'Power on and measure'], why: 'Plan and calculate first; build unpowered; then test with the meter.' },
  ] },
  L32: { title: 'Capstone: fault-finding', goal: 'Find several faults fast, with logic and the meter.', cards: ['halfsplit'], steps: [
    cpt('Think like a detective', `<p class="body"><b>Half-splitting</b>: measure in the middle of the loop first. Whichever half is wrong, test its middle next.</p><div class="def"><b>Full voltage across one part, 0 V across the rest</b> → that part is open (or a backwards LED).<br><b>Dim LED</b> → resistor too big.<br><b>Hot battery</b> → short.</div>`, CARDART.bbbug),
    bbq('b32q1', 'place', '<b>Two faults, no preview.</b> The LED and the ground jumper were removed. Put the LED in the right way and add the ground jumper.', 'LED + leg in row 6 (with the resistor), − leg in row 7, then a jumper from row 7 to the − rail.', { blind: true, parts: [W('j1', 'T+2', 'a2', RED), RS('r1', 'c2', 'c6', 470)], place: [{ id: 'd1', kind: 'led', color: 'red', label: 'LED' }, { id: 'jx', kind: 'wire', color: BLK, label: 'ground jumper' }], answer: 'LED + in row 6, − in row 7; jumper row 7 → − rail' }),
    mcq('b32q2', 'LED dark. + rail to − rail: 9 V. Across the resistor: 0 V. Across the LED: 9 V. Most likely?', ['The LED is backwards or dead', 'The battery is flat', 'The resistor is shorted'], 'No current (0 V on the resistor) and the full supply across the LED: the LED is blocking.'),
    mcq('b32q3', 'The LED is very dim. The resistor\'s bands read yellow-violet-orange (47 kΩ) instead of yellow-violet-brown (470 Ω).', ['Wrong resistor: 47 kΩ allows only about 0.15 mA', 'The LED is backwards', 'The battery is shorted'], '7 V ÷ 47 000 Ω ≈ 0.15 mA, about 100× too little.'),
    bbq('b32q4', 'fix', 'Two-LED panel: the bottom LED stays dark. Tap the faulty part.', 'R2 starts in row 3, but the + supply on the bottom half is in row 2. R2 is off by one row.', { bottom: true, parts: [W('j1', 'T+2', 'a2', RED, 'the red jumper'), RS('r1', 'c2', 'c7', 470, 'R1'), LD('d1', 'e7', 'e8', 'green'), W('j2', 'a8', 'T-8', BLK, 'the top black jumper'), W('jx', 'e2', 'f2', YEL, 'the yellow jumper'), RS('r2', 'h3', 'h7', 470, 'R2'), LD('d2', 'j7', 'j8', 'blue', 'the blue LED'), W('j3', 'g8', 'B-8', BLK, 'the bottom black jumper')], answerId: 'r2', answer: 'R2: it starts in row 3 instead of row 2' }),
    mcq('b32q5', '9 V, two parallel branches: red LED + 470 Ω, and blue LED (3 V) + 300 Ω. Total battery current?', ['About 35 mA', 'About 15 mA', 'About 20 mA'], 'Red: 7 ÷ 470 ≈ 15 mA. Blue: 6 ÷ 300 = 20 mA. Total ≈ 35 mA.'),
    tfq('b32q6', 'Half-splitting means checking the middle of the circuit first to halve the search.', true, 'Each measurement rules out half of what\'s left.'),
  ] },
});

/* ---------- unit tests 4-6 ---------- */
TESTS.T4 = { id: 'T4', unit: 'U4', title: 'Unit 4 test: Breadboard Basics', pass: 0.8, steps: [
  bbq('T4q1', 'holes', 'Tap a hole connected to <b>g11</b>.', 'g11 is in the f–j strip of row 11: f11, h11, i11 or j11.', { tag: 'L18', ref: 'g11', answer: 'f11, h11, i11 or j11' }),
  mcq('T4q2', 'd5 and g5 are…', ['Not connected: they\'re on opposite sides of the gap', 'Connected: same row number', 'Connected through the rails'], 'The center gap splits row 5 into two strips.', null),
  bbq('T4q3', 'holes', 'Split rails again. Tap a <b>− rail</b> hole that is <b>not</b> connected to the battery.', 'The battery feeds the left half; − rail holes 8–15 are past the break.', { tag: 'L19', split: true, okHole: h => /^T-(8|9|1[0-5])$/.test(h), answer: 'A − rail hole in columns 8–15' }),
  tfq('T4q4', 'A jumper straight from + rail to − rail is a short circuit.', true, 'It bypasses everything with almost zero resistance.'),
  bbq('T4q5', 'place', '<b>No preview.</b> Add the missing + jumper (the resistor starts in row 5).', 'Any + rail hole to any free hole in row 5.', { tag: 'L20', blind: true, parts: [RS('r1', 'c5', 'c9', 470), LD('d1', 'e9', 'e10'), W('j2', 'a10', 'T-10', BLK)], place: { id: 'jx', kind: 'wire', color: RED, label: 'red jumper' }, answer: 'A jumper from the + rail to row 5' }),
  mcq('T4q6', 'Header pins and breadboard holes share a spacing of…', ['2.54 mm', '1 mm', '5.08 cm'], '0.1 inch = 2.54 mm.'),
  bbq('T4q7', 'fix', 'Dark LED. Tap the part that\'s wrong.', 'The LED\'s anode faces the ground row: it\'s backwards.', { tag: 'L21', parts: [W('j1', 'T+3', 'a3', RED, 'the red jumper'), RS('r1', 'c3', 'c8', 470), LD('d1', 'e9', 'e8', 'yellow'), W('j2', 'a9', 'T-9', BLK, 'the black jumper')], answerId: 'd1', answer: 'The LED (backwards)' }),
  mcq('T4q8', 'The LED leg by the flat edge of the rim is the…', ['Cathode (−)', 'Anode (+)', 'Wiper'], 'Flat edge and short leg = cathode.'),
  bbq('T4q9', 'place', '<b>No preview.</b> Place the LED (resistor ends in row 8, ground jumper in row 12).', 'Anode in row 8, cathode in row 12.', { tag: 'L21', blind: true, parts: [W('j1', 'T+4', 'a4', RED), RS('r1', 'c4', 'c8', 470), W('j2', 'a12', 'T-12', BLK)], place: { id: 'd1', kind: 'led', color: 'blue', label: 'LED' }, answer: '+ leg in row 8, − leg in row 12' }),
  mcq('T4q10', 'Why does every LED need a series resistor?', ['To limit the current so it doesn\'t burn out', 'To make it light faster', 'To set its color'], 'Once on, an LED has little resistance; the resistor sets the current.'),
  bbq('T4q11', 'place', '<b>No preview.</b> Build the loop: place the resistor, then the LED.', 'Resistor from row 2 to a new row, LED + leg in that row, − leg in row 7.', { tag: 'L22', blind: true, parts: [W('j1', 'T+2', 'a2', RED), W('j2', 'a7', 'T-7', BLK)], place: [{ id: 'r1', kind: 'res', ohms: 470, label: 'resistor' }, { id: 'd1', kind: 'led', color: 'red', label: 'LED' }], answer: 'Resistor row 2 → row 6, LED row 6 → row 7' }),
  tfq('T4q12', 'Swapping the order of the resistor and LED in a single loop changes the current.', false, 'Series order doesn\'t matter; the current is the same everywhere in the loop.'),
].map((s, i) => Object.assign(s, { tag: s.tag || ['L18', 'L18', 'L19', 'L19', 'L20', 'L20', 'L21', 'L21', 'L21', 'L22', 'L22', 'L22'][i] })) };
TESTS.T5 = { id: 'T5', unit: 'U5', title: 'Unit 5 test: Building Real Circuits', pass: 0.8, steps: [
  mcq('T5q1', '9 V, red LED (2 V), 15 mA. Best standard resistor?', ['470 Ω', '390 Ω', '220 Ω'], '7 ÷ 0.015 ≈ 467 Ω → 470 Ω.'),
  mcq('T5q2', '5 V USB, white LED (3 V), 20 mA. Resistor?', ['100 Ω', '150 Ω', '250 Ω'], '(5 − 3) ÷ 0.02 = 100 Ω.'),
  bbq('T5q3', 'slider', 'Pick a resistor that gives <b>5–12 mA</b> from this 12 V supply.', '(12 − 2) ÷ R: 1 kΩ gives about 10 mA. 470 Ω gives about 20 mA (too much).', { tag: 'L23', volts: 12, parts: [W('j1', 'T+2', 'a2', RED), RS('r1', 'c2', 'c6', 100), LD('d1', 'e6', 'e7'), W('j2', 'a7', 'T-7', BLK)], slider: { part: 'r1', prop: 'ohms', values: [100, 220, 470, 1000, 4700, 10000], label: 'Resistor value', lo: '100 Ω', hi: '10 kΩ', fmt: v => 'Resistor: ' + ohmsTxt(v) }, readout: sol => `LED current: <b>${ledI(sol, 'd1').toFixed(1)} mA</b>`, ok: sol => { const i = ledI(sol, 'd1'); return i >= 5 && i <= 12; }, answer: '1 kΩ' }),

  L34: { title: 'RC charging & discharging', goal: 'τ = R × C, the 63% and 5τ rules, and shaping a charging curve.', cards: ['tau', 'rc63', 'rc5'], steps: [
    cpt('Filling through a resistor', `<p class="body">Charge a capacitor <b>through a resistor</b> and it doesn't fill instantly. It rises fast at first, then slower and slower.</p><div class="def"><b>τ (tau) = R × C</b> sets the pace (Ω × F = seconds).<br>After <b>1 τ</b>: about <b>63%</b> full. After <b>5 τ</b>: practically full (over 99%).</div>`, () => rcPlot(9, 1, 6), 'Discharging is the mirror image: after 1 τ only about 37% is left.'),
    sq('c34q1', 'rc', 'Set R and C so the time constant is <b>1 second</b> (0.9–1.1 s).', 'τ = R × C. 10 kΩ × 100 µF = 1 s; so does 100 kΩ × 10 µF or 22 kΩ × 47 µF (≈ 1.03 s).', { Rs: RSER, Cs: CSER, r0: 0, c0: 0, tmax: 6, ok: t => t >= .9 && t <= 1.1, answer: 'For example 10 kΩ and 100 µF' }),

    sq('c34q4', 'rc', 'Discharge: make the capacitor <b>empty out (5τ) in 1–2 seconds</b>.', '5τ between 1 and 2 s means τ between 0.2 and 0.4 s, e.g. 4.7 kΩ × 47 µF ≈ 0.22 s or 10 kΩ × 22 µF = 0.22 s.', { mode: 'discharge', Rs: RSER, Cs: CSER, r0: 6, c0: 7, tmax: 4, ok: t => 5 * t >= 1 && 5 * t <= 2, answer: 'τ between 0.2 and 0.4 s, e.g. 10 kΩ × 22 µF' }),
    tfq('c34q5', 'Doubling R doubles the time constant.', true, 'τ = R × C, so τ scales directly with R (and with C).'),
    mcq('c34q6', 'After <b>2 τ</b> of charging from 9 V, the cap is at about…', ['7.8 V (86%)', '6.3 V (70%)', '9 V (100%)'], 'Each τ closes 63% of the remaining gap: 63% then 63% of the last 37% → 86%. 0.86 × 9 ≈ 7.8 V.'),
    mcq('c34q7', 'An LED fades out as a <b>1000 µF</b> cap discharges through <b>2.2 kΩ</b>. Roughly how long until it\'s fully out?', ['About 11 s (5τ)', 'About 2.2 s', 'About 0.5 s'], 'τ = 2200 × 0.001 = 2.2 s; fully discharged ≈ 5τ = 11 s.'),

    cpt('Sizing the base resistor', `<p class="body">The transistor multiplies base current by its gain <b>β</b> (about <b>200</b> here). To switch an LED fully on, the base needs at least <b>I<sub>C</sub> ÷ β</b>, plus a safety margin.</p><div class="def"><b>R<sub>B</sub> = (V<sub>in</sub> − 0.7 V) ÷ I<sub>B</sub></b><br>Too big R<sub>B</sub>: not enough base current, the transistor is only <b>partly on</b> and the LED is dim.<br>Fully on = <b>saturated</b>: V<sub>CE</sub> ≈ 0.2 V.</div>`, CARDART.u7npn),

  L36: { title: 'The 555 timer blinker', goal: 'Astable mode: how R1, R2 and C set the blink rate and duty cycle.', cards: ['c555', 'f555', 'duty'], steps: [

    sq('c36q3', 'n555', 'Make it blink <b>at least 2 Hz</b> with a duty cycle <b>under 60%</b>.', 'Duty under 60% needs R2 much bigger than R1 (e.g. R1 1 kΩ, R2 10 kΩ → 52%). Then pick C so f ≥ 2 Hz: 22 µF gives 3.1 Hz.', { r1: 3, r2: 0, c0: 5, ok: (f, d) => f >= 2 && d < .6, answer: 'R1 = 1 kΩ, R2 = 10 kΩ, C = 22 µF (≈ 3 Hz, 52%)' }),

    const snap = (c, x, y) => {

    S.tokens = (S.tokens || 0) + add; S.testGrantTotal = GRANT_MAX; S.testGrant5000 = 1; saveLocal(); renderTop();
    toast(`+${add.toLocaleString('en-US')} test tokens`, ICON.token()); if (CLOUD.user) cloudPush().catch(cloudErr);
    return add;
  } catch (e) { return 0; }
}
// pull the cloud save, merge it with this device's save, then upload the result
async function cloudPull() {
  if (!CLOUD.user) return; CLOUD.err = ''; CLOUD.status = 'Syncing…'; renderCloud(); CLOUD.pulled = Date.now();
  try {
    const fb = await fbLoad(), ref = fb.F.doc(fb.db, 'users', CLOUD.user.uid), snap = await fb.F.getDoc(ref);
    let cloud = null; if (snap.exists()) { try { cloud = JSON.parse(snap.data().save); } catch (e) { } }
    if (cloud && typeof cloud === 'object') {
      const before = JSON.stringify(S); S = mergeSaves(S, cloud);
      migrate(); ensurePrefs(); ensureShop(); regenHearts(); saveLocal();
      if (JSON.stringify(S) !== before && !$('.lesson')) { renderTop(); const t = $('.tab.on'); showTab(t ? t.dataset.tab : 'learn'); flushToasts(); }
    }
    await cloudPush();
  } catch (e) { cloudErr(e); }
}
async function cloudPush() {
  if (!CLOUD.user) return; const fb = await fbLoad();
  await fb.F.setDoc(fb.F.doc(fb.db, 'users', CLOUD.user.uid), { save: JSON.stringify(S), updatedAt: fb.F.serverTimestamp(), app: APP_VERSION });
  CLOUD.status = 'Synced ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); CLOUD.err = ''; renderCloud();
}
window.__cloudSoon = () => { if (!CLOUD.user) return; clearTimeout(CLOUD.t); CLOUD.t = setTimeout(() => cloudPush().catch(cloudErr), 4000); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && CLOUD.user && Date.now() - CLOUD.pulled > 60000) cloudPull(); });

/* ---------- merge: the save with more progress is the base; completions, items and cards are unioned ---------- */
const progScore = s => Object.keys((s && s.done) || {}).length * 10 + Object.values((s && s.tests) || {}).filter(t => t && t.passed).length * 25 + ((s && s.xp) || 0) / 50;
function mergeSaves(a, b) {
  const [base, o] = progScore(a) >= progScore(b) ? [a, b] : [b, a], cl = x => x == null ? x : JSON.parse(JSON.stringify(x)), ob = x => x && typeof x === 'object' && !Array.isArray(x) ? x : {};
  const m = cl(base), uni = (x, y) => [...new Set([...(Array.isArray(x) ? x : []), ...(Array.isArray(y) ? y : [])])];
  const maxMap = (x, y) => { const r = Object.assign({}, ob(y), ob(x)); Object.keys(ob(y)).forEach(k => { if (typeof ob(x)[k] === 'number' && typeof y[k] === 'number') r[k] = Math.max(x[k], y[k]); }); return r; };
  Object.keys(ob(o)).forEach(k => { if (m[k] == null) m[k] = cl(o[k]); });                                  // anything only the other save has
  Object.keys(ob(o)).forEach(k => { if (/mig|fix|grant/i.test(k) && typeof o[k] === 'number') m[k] = Math.max(+m[k] || 0, o[k]); }); // migration guards never go backwards
  m.done = Object.assign({}, ob(o.done), ob(base.done));
  m.tests = {}; uni(Object.keys(ob(base.tests)), Object.keys(ob(o.tests))).forEach(id => { const x = ob(base.tests)[id], y = ob(o.tests)[id];
    m.tests[id] = !x || !y ? cl(x || y) : Object.assign({}, y, x, { passed: !!(x.passed || y.passed), best: Math.max(x.best || 0, y.best || 0), attempts: Math.max(x.attempts || 0, y.attempts || 0), placed: x.passed ? x.placed : y.placed }); });
  m.mastered = Object.assign({}, ob(o.mastered), ob(base.mastered));
  m.cards = Object.assign({}, ob(o.cards), ob(base.cards)); Object.keys(ob(o.cards)).forEach(id => { const x = ob(base.cards)[id], y = o.cards[id]; if (x && y && ((y.box || 0) > (x.box || 0) || ((y.box || 0) === (x.box || 0) && (y.due || '') > (x.due || '')))) m.cards[id] = cl(y); });
  m.days = Object.assign({}, ob(o.days), ob(base.days)); Object.keys(ob(o.days)).forEach(d => { if (o.days[d] === 'active') m.days[d] = 'active'; });
  ['xp', 'best', 'tokens', 'v'].forEach(k => { m[k] = Math.max(+base[k] || 0, +o[k] || 0); });               // counters: max (never adds, so no double-pay)
  if ((o.last || '') > (base.last || '')) { m.streak = o.streak; m.last = o.last; m.freezes = o.freezes; }
  m.tokPaid = maxMap(base.tokPaid, o.tokPaid); m.testPaidNew = maxMap(base.testPaidNew, o.testPaidNew); m.tokGranted = Object.assign({}, ob(o.tokGranted), ob(base.tokGranted));
  const av = ob(base.avatar), ov = ob(o.avatar); m.avatar = Object.assign({}, cl(ov), cl(av), { owned: uni(av.owned, ov.owned), eq: cl(av.eq || ov.eq) });
  Object.keys(ov).forEach(k => { if (/^mig/.test(k)) m.avatar[k] = Math.max(+av[k] || 0, +ov[k] || 0); });
  if (base.lab || o.lab) { m.lab = Object.assign({}, cl(ob(o.lab)), cl(ob(base.lab))); m.lab.done = Object.assign({}, ob(ob(o.lab).done), ob(ob(base.lab).done)); }
  m.deckRw = {}; uni(Object.keys(ob(base.deckRw)), Object.keys(ob(o.deckRw))).forEach(u => { const x = ob(base.deckRw)[u], y = ob(o.deckRw)[u];
    m.deckRw[u] = !x || !y ? cl(x || y) : { d: (x.d || '') > (y.d || '') ? x.d : y.d, seen: uni(x.seen, y.seen), days: uni(x.days, y.days), paid: Math.max(x.paid || 0, y.paid || 0) }; });
  m.fcTest = {}; uni(Object.keys(ob(base.fcTest)), Object.keys(ob(o.fcTest))).forEach(u => { const x = ob(base.fcTest)[u], y = ob(o.fcTest)[u]; m.fcTest[u] = !x || !y ? cl(x || y) : Object.assign({}, y, x, { best: Math.max(x.best || 0, y.best || 0) }); });
  m.games = Object.assign({}, ob(o.games), ob(base.games), { best: maxMap(ob(base.games).best, ob(o.games).best) });
  m.prefs = Object.assign({}, ob(o.prefs), ob(base.prefs)); if (!m.prefs.onboarded && ob(o.prefs).onboarded) m.prefs.onboarded = o.prefs.onboarded;
  return m;
}

/* ---------- Profile panel ---------- */
const GLOGO = '<svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function cloudPanel() { const p = el('<div class="panel" id="cloudPanel"></div>'); setTimeout(() => { renderCloud(); if (navigator.onLine !== false) fbLoad().catch(() => { }); }, 0); return p; }
function renderCloud() {
  const p = $('#cloudPanel'); if (!p) return; const u = CLOUD.user;
  p.innerHTML = `<h3>Cloud save</h3>${u ? `<div class="setrow" style="border:0;padding-top:0"><div class="l">${esc(u.displayName || 'Signed in')}<small>${esc(u.email || '')}</small></div><button class="btn ghost small" id="cloudOut" style="width:auto;padding:9px 14px">Sign out</button></div>
      <p class="small" style="margin:0">${esc(CLOUD.status || 'Your progress syncs to your Google account.')}</p>`
    : `<p class="small" style="margin:0 0 10px">You're playing as a guest. Sign in to back up your progress and pick up on any device.</p>
      <button class="gbtn" id="cloudIn" ${CLOUD.status ? 'disabled' : ''}>${GLOGO}<span>${esc(CLOUD.status || 'Sign in with Google')}</span></button>`}${CLOUD.err ? `<p class="small" style="margin:8px 0 0;color:var(--corald)">${esc(CLOUD.err)}</p>` : ''}`;
  if ($('#cloudIn', p)) $('#cloudIn', p).onclick = () => { SFX.tap(); cloudSignIn(); };
  if ($('#cloudOut', p)) $('#cloudOut', p).onclick = () => { SFX.tap(); cloudSignOut(); };
}
// returning player who signed in before (or is coming back from a redirect): restore the session quietly
if (syncInfo().uid || syncInfo().redirect) setTimeout(() => fbLoad().catch(() => { }), 800);
