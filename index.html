<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2FF">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zapling">
<title>Zapling: learn electronics, one spark at a time</title>
<style>
:root{
  --bg:#F5F2FF; --bg2:#ECE7FF; --card:#FFFFFF; --ink:#2E2A5A; --ink2:#6B6899; --line:#E4E0F5;
  --mint:#2EC4A0; --mintd:#1C9E80; --mintl:#DDF8EF;
  --coral:#FF7F6E; --corald:#E0604F; --corall:#FFE6E1;
  --sun:#FFC94D; --sund:#E3A31A; --sunl:#FFF3D6;
  --peri:#7C83FD; --perid:#5A61D8; --peril:#E7E8FF;
  --lock:#DCD8EE; --lockd:#B9B4D6;
  --pink:#FF9DB5;
  --r:20px;
  --shadow:0 6px 0 rgba(46,42,90,.08), 0 10px 30px rgba(46,42,90,.08);
  --font: ui-rounded, "SF Pro Rounded", "Nunito Sans", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%, #fff 0 60px, transparent 61px),radial-gradient(circle at 92% 30%, #EFEAFF 0 90px, transparent 91px),radial-gradient(circle at 6% 70%, #EAF8F3 0 80px, transparent 81px);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px);
  background:rgba(245,242,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:21px;letter-spacing:-.3px;margin-right:auto}
.brand .word{background:linear-gradient(90deg,var(--mintd),var(--peri));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-weight:800;font-size:15px;line-height:1}
.chip svg{width:22px;height:22px}
.chip.dim{color:var(--ink2)}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:12px;display:inline-flex}
.iconbtn:focus-visible,.btn:focus-visible,.node:focus-visible,.opt:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
/* ---------- views ---------- */
main{flex:1;padding-bottom:96px}
.view{display:none}.view.on{display:block}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.bottomnav .inner{display:flex;gap:6px;max-width:560px;width:100%}
.tab{flex:1;border:0;background:transparent;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;color:var(--ink2);cursor:pointer;position:relative}
.tab svg{width:28px;height:28px}
.tab.on{background:var(--peril);color:var(--perid)}
.tab .badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--coral);color:#fff;font-size:11px;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
/* ---------- path ---------- */
.unit{margin:18px 14px 8px;position:relative}
.unitbanner{border-radius:22px;padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.unitbanner .num{font-size:12px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.unitbanner h2{margin:2px 0 0;font-size:20px;line-height:1.15}
.unitbanner .meta{margin-left:auto;text-align:right;font-weight:800;font-size:13px;white-space:nowrap}
.unitbanner.locked{background:var(--lock)!important;color:#7D78A3;box-shadow:0 5px 0 var(--lockd)}
.pathwrap{position:relative;margin:6px auto 0;width:100%;}
.pathsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.node{position:absolute;width:74px;height:70px;margin-left:-37px;border:0;background:transparent;cursor:pointer;padding:0}
.node .disc{position:absolute;left:0;top:0;width:74px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.node .disc::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 7px 0 var(--sh,#1C9E80);z-index:-1}
.node:active .disc{transform:translateY(4px)}
.node .disc svg{width:36px;height:36px}
.node.done .disc{background:var(--mint);--sh:var(--mintd)}
.node.current .disc{background:var(--coral);--sh:var(--corald)}
.node.locked .disc{background:var(--lock);--sh:var(--lockd)}
.node.test .disc{border-radius:24px}
.node.current::before{content:"";position:absolute;left:-9px;top:-9px;width:92px;height:84px;border-radius:50%;border:4px solid var(--coral);opacity:.35;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.45}50%{transform:scale(1.04);opacity:.15}}
.node .lbl{position:absolute;top:76px;left:50%;transform:translateX(-50%);width:130px;text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);line-height:1.15}
.node.current .lbl{color:var(--corald)}
.startbubble{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#fff;color:var(--corald);font-weight:900;font-size:13px;letter-spacing:.6px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
.startbubble::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.pathmascot{position:absolute;width:86px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pathmascot svg{overflow:visible}
.avbody,.aveyes,.avpet,.avarm,.avaura{transform-box:fill-box}.avbody{transform-origin:50% 100%}.aveyes,.avpet,.avaura{transform-origin:50% 50%}.avarm{transform-origin:50% 12%}
.avspark{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.ev-happy,.ev-wink,.ev-sleep,.mo-open,.mo-o,.avzz{display:none}
.a-wave .ev-open,.a-wiggle .ev-open,.a-wink .ev-open,.a-doze .ev-open{display:none}.a-wave .ev-happy,.a-wiggle .ev-happy,.a-wink .ev-wink,.a-doze .ev-sleep,.a-doze .avzz{display:inline}
.a-wave .mo-smile,.a-hop .mo-smile,.a-sparkle .mo-smile,.a-bounce .mo-smile,.a-doze .mo-smile{display:none}.a-wave .mo-open,.a-hop .mo-open,.a-sparkle .mo-open,.a-bounce .mo-open{display:inline}.a-doze .mo-o{display:inline}
.a-bounce .avbody{animation:avBounce .8s ease-out}.a-bounce .avpet{animation:avHop .8s .1s ease-out}
.a-wiggle .avbody{animation:avWiggle .9s ease-in-out}
.a-blink .aveyes{animation:avBlink .45s ease-in-out 2}
.a-wave .avarm{animation:avArm 1.2s ease-in-out}.a-wave .avbody{animation:avTilt 1.2s ease-in-out}
.a-wink .avbody{animation:avTilt .9s ease-in-out}
.a-doze .avbody{animation:avDoze 2s ease-in-out}.a-doze .avzz{animation:avZz 2s ease-out}
.a-hop .avbody{animation:avHop .9s cubic-bezier(.3,.7,.4,1)}.a-hop .avpet{animation:avHop .9s .15s cubic-bezier(.3,.7,.4,1)}
.a-sparkle .avspark{animation:avSpark 1.2s ease-out}.a-sparkle .avbody{animation:avBounce .8s ease-out}
.avaura{animation:avTwinkle 2.4s ease-in-out infinite}
@keyframes avBounce{0%,100%{transform:none}30%{transform:scale(1.06,.92)}55%{transform:translateY(-7px) scale(.97,1.04)}80%{transform:scale(1.02,.98)}}
@keyframes avWiggle{0%,100%{transform:none}20%{transform:rotate(-7deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-4deg)}}
@keyframes avBlink{0%,100%{transform:none}50%{transform:scaleY(.1)}}
@keyframes avTilt{0%,100%{transform:none}35%{transform:rotate(-5deg)}70%{transform:rotate(-3deg)}}
@keyframes avArm{0%,100%{transform:none}20%{transform:rotate(-120deg)}40%{transform:rotate(-90deg)}60%{transform:rotate(-125deg)}80%{transform:rotate(-95deg)}}
@keyframes avDoze{0%,100%{transform:none}40%,70%{transform:rotate(4deg) translateY(1px) scale(1.01,.98)}}
@keyframes avZz{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes avHop{0%,100%{transform:none}15%{transform:scale(1.08,.9)}45%{transform:translateY(-16px) scale(.95,1.06)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes avSpark{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes avTwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.94)}}
.shopcats{display:flex;gap:6px;overflow-x:auto;margin:0 -4px 10px;padding:2px 4px 6px;scrollbar-width:none}.shopcats::-webkit-scrollbar{display:none}
.shopcats button{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-weight:800;font-size:13px;color:var(--ink2);cursor:pointer}
.shopcats button.on{background:var(--peri);border-color:var(--peri);color:#fff}
@media (prefers-reduced-motion:reduce){.avbody,.avpet,.avarm,.avaura,.avspark,.avzz{animation:none!important}.a-blink .aveyes{animation:avBlink .6s ease-in-out!important}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pop{position:absolute;z-index:15;left:50%;transform:translateX(-50%);width:min(320px,88vw);background:#fff;border-radius:20px;padding:14px 16px 16px;box-shadow:var(--shadow);border:2px solid var(--line);animation:popin .16s ease-out}
.pop h3{margin:0 0 4px;font-size:18px}.pop p{margin:0 0 12px;color:var(--ink2);font-size:14.5px;line-height:1.35}
@keyframes popin{from{opacity:0;transform:translate(-50%,6px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
.hello{margin:14px 14px 0;display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:var(--shadow)}
.hello .txt{font-size:14.5px;line-height:1.35}.hello b{font-size:16px}
.hello svg.m{width:64px;flex:none}
.dailygoal{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.dailygoal i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .5s}
/* ---------- buttons ---------- */
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:16px;letter-spacing:.4px;cursor:pointer;width:100%;text-transform:uppercase;transition:transform .08s, filter .15s;position:relative}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mintd)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--corald)}
.btn.peri{background:var(--peri);color:#fff;box-shadow:0 5px 0 var(--perid)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{background:var(--lock);color:#9B96BF;box-shadow:0 5px 0 var(--lockd);cursor:not-allowed}
.btn.small{padding:9px 12px;font-size:13.5px;border-radius:12px;width:auto}
.row{display:flex;gap:10px}
/* ---------- lesson ---------- */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.lesson .inner{max-width:620px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;gap:10px;padding:12px 14px}
.prog{flex:1;height:16px;background:var(--bg2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#5EE0BC);border-radius:99px;transition:width .35s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.45)}
.hearts{display:flex;align-items:center;gap:2px;font-weight:900;color:var(--corald)}
.hearts svg{width:24px;height:24px}
.hearts .lost{opacity:.25;filter:grayscale(1)}
.hearts.shake{animation:shake .4s}
.hearts .cd,.chip .cd{font-size:11.5px;font-weight:800;color:var(--ink2);margin-left:3px;font-variant-numeric:tabular-nums}
.oohcd{display:inline-flex;align-items:center;gap:8px;background:var(--corall);color:var(--corald);border-radius:999px;padding:10px 18px;font-weight:800;font-size:17px;margin:4px 0 12px}.oohcd svg{width:26px;height:26px}.oohcd b{font-variant-numeric:tabular-nums}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.stage{flex:1;overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.kicker{font-size:12.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--peri);margin:6px 0 4px}
.q{font-size:21px;font-weight:800;line-height:1.28;margin:0 0 14px}
.stage p.body{font-size:17px;line-height:1.5;margin:0 0 12px}
.def{background:var(--peril);border-radius:14px;padding:10px 12px;margin:8px 0 12px;font-size:15px;line-height:1.4}
.def b{color:var(--perid)}
.art{background:#fff;border-radius:22px;padding:10px;margin:0 0 14px;box-shadow:0 4px 0 var(--line);display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}
.art svg{width:100%;height:auto;max-height:280px;display:block}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 14px;font-size:16.5px;font-weight:700;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s;display:flex;align-items:center;gap:10px;line-height:1.3}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:var(--peri);background:var(--peril);box-shadow:0 4px 0 #C6C9FF}
.opt.sel .k{border-color:var(--peri);color:var(--perid)}
.opt.right{border-color:var(--mint);background:var(--mintl);box-shadow:0 4px 0 #A8EBD6}
.opt.wrong{border-color:var(--coral);background:var(--corall);box-shadow:0 4px 0 #FFC4BA}
.opt.big{justify-content:center;font-size:19px;padding:20px}
.opt[disabled]{cursor:default}
/* order */
.slots{min-height:64px;border:2px dashed var(--lockd);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;background:rgba(255,255,255,.5)}
.slots .ph{color:var(--ink2);font-size:14px;padding:10px;text-align:center}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font-weight:800;font-size:15.5px;cursor:pointer;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px;text-align:left}
.tile .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--peri);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile.used{visibility:hidden}
/* sort */
.sortrow{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 8px 8px 12px;margin-bottom:8px}
.sortrow .t{flex:1;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.sortrow .t svg{width:34px;height:34px;flex:none}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on.a{background:var(--sunl);border-color:var(--sun);color:#8A5A00}
.pill.on.b{background:var(--peril);border-color:var(--peri);color:var(--perid)}
.sortrow.right{border-color:var(--mint)}.sortrow.wrong{border-color:var(--coral);background:var(--corall)}
/* sims */
.sim{background:#FBFAFF;border-radius:22px;border:2px solid var(--line);padding:6px;margin-bottom:12px;position:relative;touch-action:manipulation}
.sim svg{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none}
.simbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:6px 0 10px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.status.ok{background:var(--mintl);color:var(--mintd)}.status.bad{background:var(--corall);color:var(--corald)}.status.warn{background:var(--sunl);color:#8A5A00}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mat{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12.5px;cursor:grab;box-shadow:0 3px 0 var(--line);touch-action:none;position:relative;text-align:center;line-height:1.1}
.mat svg{width:46px;height:34px}
.mat.inuse{border-color:var(--peri);background:var(--peril)}
.mat .res{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.mat .res.y{background:var(--sun)}.mat .res.n{background:var(--lockd)}
.mat .res svg{width:13px;height:13px}
.ghostdrag{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.95}
.range{width:100%;accent-color:var(--coral);height:34px}
.rangebox{background:#fff;border-radius:16px;border:2px solid var(--line);padding:10px 14px 6px;margin-bottom:10px}
.rangebox .v{font-size:26px;font-weight:900;text-align:center}
.rangebox .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:700}
.tapzone{cursor:pointer}
.tapzone:hover .hl{stroke-opacity:.18}
.seg-sel .hl{stroke:var(--peri)!important;stroke-opacity:.45!important}
.flowtoggle{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px}
.flowtoggle button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink2)}
.flowtoggle button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
/* footer / feedback */
.lfoot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:#fff}
.lfoot .inner2{max-width:620px;margin:0 auto}
.fb{border-top:0;animation:slideup .2s ease-out}
.fb.good{background:var(--mintl)}.fb.bad{background:var(--corall)}
.fbhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fbhead .ic{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.fbhead .ic svg{width:26px;height:26px}
.fbhead b{font-size:19px}.fb.good b{color:var(--mintd)}.fb.bad b{color:var(--corald)}
.fbhead .xp{margin-left:auto;font-weight:900;color:#8A5A00;background:var(--sunl);border-radius:999px;padding:4px 10px;font-size:14px}
.why{background:#fff;border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:15px;line-height:1.45;display:none;max-height:32vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.whylbl{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;letter-spacing:.4px;color:var(--ink2);margin:0 0 4px}.whylbl svg{width:15px;height:15px}
.why.on{display:block;animation:slideup .2s}
.whybtn{border:0;background:rgba(255,255,255,.7);border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer;margin-bottom:10px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
@keyframes slideup{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
/* flashcards */
.fc{perspective:1000px;margin:6px auto 14px;width:100%;max-width:380px;height:280px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1.2);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}

.labhandles button svg{width:22px;height:22px}.labhandles button.x{border-color:var(--coral);color:var(--corald);font-size:24px;line-height:1}.labhandles button[hidden],.labhandles[hidden]{display:none}

.cookcard .ct{flex:1;display:flex;flex-direction:column;gap:2px}.cookcard b{font-size:17px;font-weight:900}.cookcard small{font-size:13.5px;font-weight:700;opacity:.95}.cookcard .cg{flex:none;width:22px;height:22px;opacity:.95}
.cookbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 9px;font:inherit;font-weight:900;font-size:13.5px;color:var(--perid);cursor:pointer;box-shadow:0 3px 0 var(--line)}

/* ---- shop restyle (preview): soft pastel cards, rounded tiles, pastel tabs, cute stage ---- */
.shopwrap{background:linear-gradient(180deg,#FFF6FB 0%,#F4F0FF 60%,#EEF9F6 100%);border:0;border-radius:26px;box-shadow:0 6px 18px rgba(124,131,253,.13)}

.spdesc{margin:0 0 4px;color:var(--ink2);font-weight:700;font-style:italic;font-size:14px}
.sppv{cursor:pointer}.sppv.boing svg{animation:boing .7s cubic-bezier(.3,.7,.3,1.4)}
@keyframes boing{0%{transform:scale(1,1)}25%{transform:scale(1.14,.86)}50%{transform:scale(.92,1.1)}75%{transform:scale(1.04,.97)}100%{transform:none}}
.avface .googly{animation:googly 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes googly{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(1px,-2px)}75%{transform:translate(2px,2px)}}
.avface .smoke{animation:smoke 2.6s ease-in-out infinite}@keyframes smoke{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-5px);opacity:.5}}
.avface .drool{animation:drool 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:top}@keyframes drool{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
.avface .zz{animation:fade 1.6s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.avface *,.sppv.boing svg{animation:none!important}}
.whymore{margin-top:8px;font-size:14.5px}.whymore summary{cursor:pointer;font-weight:900;color:var(--peri);list-style:none;display:inline-flex;align-items:center;gap:4px}.whymore summary::-webkit-details-marker{display:none}
.whymore summary::before{content:'▸';transition:transform .15s}.whymore[open] summary::before{transform:rotate(90deg)}.whymore ol,.whymore ul{margin:6px 0 0;padding-left:20px;line-height:1.45}.whymore li{margin:3px 0}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="brand" aria-label="Zapling"><span id="brandMascot" style="width:34px;display:inline-flex"></span><span class="word">Zapling</span></div>
    <span class="chip" id="chipHearts" title="Hearts" role="img"></span>
    <span class="chip" id="chipStreak" title="Daily streak"></span>
    <span class="chip" id="chipFreeze" title="Streak freezes"></span>
    <span class="chip" id="chipXp" title="XP and level"></span>
    <span class="chip" id="chipTok" title="Tokens"></span>
    <button class="iconbtn" id="btnSound" aria-label="Toggle sound"></button>
  </header>
  <main>
    <section id="v-learn" class="view on" aria-label="Lesson path"></section>
    <section id="v-review" class="view" aria-label="Flashcards"></section>
    <section id="v-games" class="view" aria-label="Practice"></section>
    <section id="v-shop" class="view" aria-label="Avatar shop"></section>
    <section id="v-profile" class="view" aria-label="Profile and settings"></section>
  </main>
  <nav class="bottomnav" aria-label="Main">
    <div class="inner">
      <button class="tab on" data-tab="learn" id="tabLearn"></button>
      <button class="tab" data-tab="review" id="tabReview"></button>
      <button class="tab" data-tab="games" id="tabGames"></button>
      <button class="tab" data-tab="shop" id="tabShop"></button>
      <button class="tab" data-tab="profile" id="tabProfile"></button>
    </div>
  </nav>
</div>
<canvas id="confetti"></canvas>
<script>
"use strict";
/* =========================================================
   ART: icons, mascot "Sprig", circuit component, sims art
   All artwork is original inline SVG.
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
let _uid = 0; const uid = () => 'u' + (++_uid);

const ICON = {
  flame: (on = true) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.2 2.2c.8 3.3 5.3 5.4 5.3 10.3a5.5 5.5 0 0 1-11 0c0-2.4 1.3-4 2.5-5 .2 1.7 1 2.8 2.1 3.2-.2-3.3.1-6 1.1-8.5z" fill="${on ? '#FF8A3D' : '#CFCBE3'}"/><path d="M12 12.3c.7 1.5 2.6 2.3 2.6 4.4a2.6 2.6 0 0 1-5.2 0c0-1.4 1-2.4 1.7-2.8.1.6.4 1.1.9 1.2 0-1.1-.1-2 0-2.8z" fill="${on ? '#FFD166' : '#E6E3F2'}"/></svg>`,
  snow: () => `<svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#5AB8F0" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.6 4.6 12 6.5l2.4-1.9M9.6 19.4 12 17.5l2.4 1.9M4.3 10.4l2.9-.6-.9-2.9M19.7 13.6l-2.9.6.9 2.9M6.3 17.1l.9-2.9-2.9-.6M17.7 6.9l-.9 2.9 2.9.6"/></g></svg>`,
  bolt: () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.6h6.2L9.6 22l9.2-12h-6.3z" fill="#FFC94D" stroke="#E3A31A" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  heart: (cls = '') => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M12 21.2s-8.6-5.3-8.6-11.4A4.7 4.7 0 0 1 12 7.1a4.7 4.7 0 0 1 8.6 2.7c0 6.1-8.6 11.4-8.6 11.4z" fill="#FF6F7F" stroke="#E0506A" stroke-width="1.4"/><ellipse cx="7.8" cy="9.6" rx="1.8" ry="1.2" fill="#fff" opacity=".6" transform="rotate(-30 7.8 9.6)"/></svg>`,
  check: (c = '#1C9E80') => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  cross: (c = '#E0604F') => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round"/></svg>`,
  lock: (c = '#9E99C2') => `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="3" fill="${c}"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5" fill="none" stroke="${c}" stroke-width="2.6"/><circle cx="12" cy="15.5" r="1.6" fill="#fff"/></svg>`,
  star: (c = '#fff') => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.7 5.6 6.1.8-4.4 4.3 1.1 6.1L12 16.7l-5.5 2.9 1.1-6.1-4.4-4.3 6.1-.8z" fill="${c}" stroke="rgba(0,0,0,.08)" stroke-linejoin="round"/></svg>`,
  trophy: (c = '#fff') => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10v5a5 5 0 0 1-10 0z" fill="${c}"/><path d="M7 5H4.2v1.6A3.4 3.4 0 0 0 7.6 10M17 5h2.8v1.6A3.4 3.4 0 0 1 16.4 10" fill="none" stroke="${c}" stroke-width="1.8"/><path d="M10.6 13h2.8v3.4h-2.8zM8 17h8v3.4H8z" fill="${c}"/></svg>`,
  path: () => `<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="8" cy="7" r="4.2" fill="currentColor" opacity=".9"/><circle cx="19" cy="14" r="4.2" fill="currentColor" opacity=".6"/><circle cx="9" cy="21.5" r="4.2" fill="currentColor" opacity=".35"/><path d="M11 9.3 16 12M16.2 16.3 12 19.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>`,
  cards: () => `<svg viewBox="0 0 28 28" aria-hidden="true"><rect x="5.5" y="4" width="14" height="19" rx="3.5" fill="currentColor" opacity=".35" transform="rotate(-10 12 13)"/><rect x="9" y="5.5" width="14" height="19" rx="3.5" fill="currentColor"/><path d="M13 12h6M13 16h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
  user: () => `<svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="10" r="5" fill="currentColor"/><path d="M4.5 24c1.2-5 5-7.6 9.5-7.6s8.3 2.6 9.5 7.6z" fill="currentColor" opacity=".75"/></svg>`,
  soundOn: () => `<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 9.5h3.6L12.5 5v14l-4.9-4.5H4z" fill="#7C83FD"/><path d="M15.5 9a4 4 0 0 1 0 6M17.8 6.6a7.4 7.4 0 0 1 0 10.8" fill="none" stroke="#7C83FD" stroke-width="2" stroke-linecap="round"/></svg>`,
  soundOff: () => `<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 9.5h3.6L12.5 5v14l-4.9-4.5H4z" fill="#B9B4D6"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="#B9B4D6" stroke-width="2" stroke-linecap="round"/></svg>`,
  close: () => `<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="#9E99C2" stroke-width="2.8" stroke-linecap="round"/></svg>`,
  why: () => `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#7C83FD"/><path d="M9.3 9.4a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2.9-1.2 1.8v.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.3" fill="#fff"/></svg>`,
  bulb: (c = '#fff') => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.9 1.1.9 1.9v.8h5.8v-.8c0-.8.3-1.4.9-1.9A6.5 6.5 0 0 0 12 2.5z" fill="${c}"/><rect x="9" y="18.2" width="6" height="3.3" rx="1.4" fill="${c}" opacity=".8"/></svg>`,
  flip: () => `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" fill="none" stroke="#6B6899" stroke-width="2.2" stroke-linecap="round"/><path d="M18.5 3v4h-4M5.5 21v-4h4" fill="none" stroke="#6B6899" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

/* ---------- Mascot: "Sprig" (v7.5): Cappy's capacitor-can body, a bit taller, pastel mint, sprout growing from the lid ---------- */
function mascot(mood = 'happy', extra = '') {
  const ink = '#2E2A5A', c = '#AEEFD9', k = '#5DBFA3', y = 88;
  const open = (x, dy = 0) => `<ellipse cx="${x}" cy="${y}" rx="6.3" ry="7.8" fill="${ink}"/><ellipse cx="${x}" cy="${y + 3.6}" rx="4.2" ry="2.6" fill="#5A61D8" opacity=".55"/><circle cx="${x + 2.1}" cy="${y - 3 + dy}" r="2.7" fill="#fff"/><circle cx="${x - 2.2}" cy="${y + 2.2}" r="1.3" fill="#fff"/><path d="M${x - 3.6} ${y - 4.8}l.8 1.6 1.6.8-1.6.8-.8 1.6-.8-1.6-1.6-.8 1.6-.8z" fill="#fff" opacity=".9"/>`;
  const arc = x => `<path d="M${x - 5} ${y + 1}q5-6.5 10 0" stroke="${ink}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  const arm = (x, ay, r) => `<ellipse cx="${x}" cy="${ay}" rx="6.5" ry="10" fill="${c}" stroke="${k}" stroke-width="2.5" transform="rotate(${r} ${x} ${ay})"/>`;
  const eyes = { happy: open(47) + open(73), cheer: arc(47) + arc(73), sad: open(47) + open(73) + `<path d="M39 75.5l9 2.6M81 75.5l-9 2.6" stroke="${ink}" stroke-width="2.6" stroke-linecap="round"/>`, think: open(47, -1.5) + open(73, -1.5) + `<path d="M66 75q7-3 13 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>` }[mood] || open(47) + open(73);
  const mouth = { cheer: `<path d="M55 97q5 8 10 0z" fill="#C2405E" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/><path d="M57.5 100.6q2.5-2 5 0" fill="#FF8FA3"/>`, sad: `<path d="M55.8 102.5q4.2-4 8.4 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`, think: `<path d="M56.5 100.5h7" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>` }[mood] || `<path d="M55.8 99q4.2 4.4 8.4 0" stroke="${ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const armsB = mood === 'cheer' ? arm(19, 80, -28) : arm(24, 102, 22);
  const armsF = mood === 'cheer' ? arm(101, 80, 28) : mood === 'think' ? arm(84, 106, -62) : mood === 'sad' ? arm(95, 106, -10) : arm(96, 102, -22);
  const fx = mood === 'cheer' ? `<g fill="#FFC94D"><path d="M12 44l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M106 36l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z"/><circle cx="104" cy="56" r="2.5"/></g>` : mood === 'sad' ? `<path d="M80 93q3 5 0 7q-3-2 0-7z" fill="#8FD0FF"/>` : '';
  const leafL = mood === 'sad' ? 'transform="rotate(-22 60 35)"' : '', leafR = mood === 'sad' ? 'transform="rotate(22 60 31)"' : '';
  return `<svg class="m" viewBox="0 8 120 142" role="img" aria-label="Sprig the Zapling sprout" ${extra}>

const BAND = { 0: '#2E2A5A', 1: '#8B5A2B', 2: '#E0604F', 3: '#F2A93B', 4: '#F5D33B', 5: '#2EC4A0', 6: '#5AB8F0', 7: '#B57EDC', 8: '#9E99C2', 9: '#FFFFFF' };
function bandsFor(ohms) { const e = Math.floor(Math.log10(ohms)) - 1; const d = Math.round(ohms / Math.pow(10, e)); return [BAND[Math.floor(d / 10)], BAND[d % 10], e < 0 ? '#D4AF37' : BAND[e]]; }

/* animation manager */
const Anim = {
  fns: new Set(), raf: 0,
  add(fn) { this.fns.add(fn); if (!this.raf) this.raf = requestAnimationFrame(this.loop); return () => this.fns.delete(fn); },
  loop: t => { Anim.raf = 0; Anim.fns.forEach(f => { try { f(t); } catch (e) { console.error(e); Anim.fns.delete(f); } }); if (Anim.fns.size) Anim.raf = requestAnimationFrame(Anim.loop); },
  clear() { this.fns.clear(); },
};

/* flowing charge dots along a path */
function makeFlow(svg, d, o = {}) {
  const layer = svg.querySelector('.dots');
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); layer.appendChild(p);
  const L = p.getTotalLength(); const n = o.n || 16;
  const st = { on: false, speed: o.speed || 70, mode: o.mode || 'conv', hide: o.hide || [], hot: !!o.hot };
  const dots = [];
  for (let i = 0; i < n; i++) {
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<circle r="5.2"/><path d="M-2.4 0h4.8M0 -2.4v4.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>`;
    layer.appendChild(g); dots.push(g);
  }
  const style = () => dots.forEach(g => {
    const c = g.firstChild, pl = g.lastChild;
    if (st.hot) { c.setAttribute('fill', '#FF7A3D'); pl.setAttribute('d', 'M-2.4 0h4.8M0 -2.4v4.8'); }
    else if (st.mode === 'conv') { c.setAttribute('fill', '#FFC43D'); c.setAttribute('stroke', '#E3A31A'); c.setAttribute('stroke-width', '1.2'); pl.setAttribute('d', 'M-2.4 0h4.8M0 -2.4v4.8'); }
    else { c.setAttribute('fill', '#7C83FD'); c.setAttribute('stroke', '#5A61D8'); c.setAttribute('stroke-width', '1.2'); pl.setAttribute('d', 'M-2.4 0h4.8'); }
  });
  style();
  let off = 0, last = null;
  const stop = Anim.add(t => {
    if (!svg.isConnected) { stop(); return; }
    if (last == null) last = t; const dt = Math.min(60, t - last); last = t;
    if (st.on) off = (off + st.speed * dt / 1000) % L;
    for (let i = 0; i < n; i++) {
      let s = (off + i * L / n) % L; if (st.mode === 'elec') s = L - s;
      const pt = p.getPointAtLength(s);
      let hidden = false;
      for (const hr of st.hide) if (hr.active() && pt.x > hr.x1 && pt.x < hr.x2 && pt.y > hr.y1 && pt.y < hr.y2) hidden = true;
      dots[i].setAttribute('transform', `translate(${pt.x.toFixed(1)},${pt.y.toFixed(1)})`);
      dots[i].style.opacity = hidden ? 0 : 1;
    }
  });
  return {
    set(on, speed) { st.on = on; if (speed != null) st.speed = speed; },
    mode(m) { st.mode = m; style(); },
    get on() { return st.on; },
    hideRect(r) { st.hide.push(r); },
  };
}

/* build a circuit element with an API */
function makeCircuit(cfg = {}) {
  const wrap = document.createElement('div'); wrap.className = 'sim';
  wrap.innerHTML = circuitSVG(cfg);
  const svg = wrap.querySelector('svg');
  const api = { wrap, svg, lit: 0 };
  api.flow = makeFlow(svg, MAIN_D, { n: 18, mode: cfg.mode || 'conv' });
  if (cfg.short) api.shortFlow = makeFlow(svg, SHORT_D, { n: 9, hot: true, speed: 220 });
  api.setBulb = (b, state = 'ok') => {
    api.lit = b;
    const gl = svg.querySelector('.glow'), lg = svg.querySelector('.litglass'), fil = svg.querySelector('.fil');
    const on = b > 0.02 && state !== 'burnt';

  l23: {

      { type: 'mc', id: 'l26q3', q: 'On a schematic, what is <b>U3</b>?', opts: ['The third IC', 'A 3 V battery', 'The third resistor'], a: 0, why: 'U is the letter for integrated circuits (chips), and 3 means it\'s the third one.' },

Object.assign(LESSONS, {
  l28: {
    title: 'Loops add up (KVL)', goal: 'Use Kirchhoff\'s Voltage Law to find a missing voltage.', cards: ['kvl', 'drop'],
    steps: [
      { type: 'concept', kicker: 'New law', title: 'Kirchhoff\'s Voltage Law', art: ART.kvl,
        html: `<p class="body">Gustav <b>Kirchhoff</b> (say "KEER-koff") noticed something simple: go around <b>any closed loop</b> and the battery's push gets <b>completely used up</b> by the parts.</p><div class="def"><b>KVL:</b> voltage rises = voltage drops.<br>The voltage across a part is its <b>voltage drop</b>.<br><b>Example:</b> 9 V = 4 V (R1) + 3 V (R2) + <b>2 V</b> (R3).</div>`, tip: 'You already used this in Unit 4: voltages in series add up to the battery.' },
      { type: 'sim', kind: 'probe', id: 'l28q1', graded: true, circuit: 'series3', want: ['C', 'G'], opts: ['2 V', '5 V', '9 V'], a: 0,
        q: '<b>Drag the probes</b> (or tap a probe, then a dot) to the two ends of <b>R3</b>. Read the meter and pick R3\'s voltage.', why: 'R3 sits between node C (2 V) and ground (0 V), so it drops 2 V. KVL check: 4 V + 3 V + 2 V = 9 V.' },
      { type: 'mc', id: 'l28q2', q: 'A 12 V battery drives three resistors in series. Two of them drop 5 V and 4 V. What does the third drop?', opts: ['3 V', '9 V', '12 V'], a: 0, why: 'KVL: 12 = 5 + 4 + ?, so the third drops 12 − 9 = 3 V.' },
      { type: 'tf', id: 'l28q3', q: 'Around a closed loop, the voltage drops add up to the battery\'s voltage.', a: true, why: 'That\'s KVL. Energy given to each coulomb by the battery is all used by the parts on the way around.' },
    ],
  },
  l29: {
    title: 'Junctions balance (KCL)', goal: 'Use Kirchhoff\'s Current Law at a junction.', cards: ['kcl', 'node'],
    steps: [
      { type: 'concept', kicker: 'New law', title: 'Kirchhoff\'s Current Law', art: ART.kclArt,
        html: `<p class="body">A <b>node</b> is a connection point where parts meet. Charge can't pile up there or vanish, so:</p><div class="def"><b>KCL:</b> total current <b>in</b> = total current <b>out</b>.<br><b>Example:</b> 2 A + 1 A flow in, 1.5 A leaves on one wire, so the other wire carries <b>3 − 1.5 = 1.5 A</b> out.</div>`, tip: 'Think of water pipes: whatever flows into a joint has to flow out.' },
      { type: 'sim', kind: 'kcl', id: 'l29q1', graded: true, ins: [2, 1.5], outs: [1], max: 4, step: 0.5,
        q: 'Currents flow into this node. Slide the last wire\'s current until the node <b>balances</b>, then press Check.', why: 'In: 2 + 1.5 = 3.5 A. Out must also be 3.5 A, so the last wire carries 3.5 − 1 = 2.5 A.', answer: '2.5 A' },
      { type: 'mc', id: 'l29q2', q: '5 A flows into a node. One wire carries 2 A out. What does the other wire carry out?', opts: ['3 A', '7 A', '2 A'], a: 0, why: 'KCL: 5 = 2 + ?, so ? = 3 A.' },
      { type: 'tf', id: 'l29q3', q: 'More current can leave a junction than enters it.', a: false, why: 'Charge isn\'t created at a junction. In always equals out.' },
    ],
  },
  l30: {
    title: 'Node voltages', goal: 'Measure every node from ground and solve one unknown.', cards: ['nodev', 'vdiff'],
    steps: [
      { type: 'concept', kicker: 'New idea', title: 'Measure everything from ground', art: ART.kvl,
        html: `<p class="body">Pick one node as <b>ground (0 V)</b>. Every other node's <b>node voltage</b> is measured from there, with the black probe on ground.</p><div class="def">The voltage <b>across a part</b> = the difference between the node voltages at its two ends.<br><b>Example:</b> R1 connects A (9 V) and B (5 V), so it has <b>9 − 5 = 4 V</b> across it.</div>` },
      { type: 'concept', kicker: 'Worked example', title: 'Solving one unknown node', art: ART.nodes2,
        html: `<p class="body">12 V feeds R1 = 4 kΩ and R2 = 2 kΩ. What is node <b>B</b>?</p><div class="def">KCL at B: current in through R1 = current out through R2.<br>Guess <b>B = 4 V</b>: R1 has 12 − 4 = 8 V → 8 ÷ 4 kΩ = 2 mA. R2 has 4 V → 4 ÷ 2 kΩ = 2 mA. In = out ✓<br>(mA = milliamps, thousandths of an amp.) Same answer as the divider formula: 12 × 2 ÷ 6 = 4 V.</div>` },
      { type: 'sim', kind: 'probe', id: 'l30q1', graded: true, circuit: 'div2', want: ['B', 'G'], blackFixed: 'G', opts: ['4 V', '8 V', '6 V'], a: 0,
        q: 'The black probe is on ground. <b>Drag the red probe to node B</b>, then pick B\'s node voltage.', why: 'Node B reads 4 V from ground, matching the math: in and out currents are both 2 mA only when B = 4 V.' },
      { type: 'mc', id: 'l30q2', q: 'A resistor connects a node at 7 V to a node at 3 V. What voltage is across it?', opts: ['4 V', '10 V', '3 V'], a: 0, why: 'Voltage across = difference of node voltages: 7 − 3 = 4 V.' },
    ],
  },
  l31: {
    title: 'Superposition', goal: 'Handle two batteries by taking them one at a time.', cards: ['superpos', 'srcoff'],
    steps: [
      { type: 'concept', kicker: 'New trick', title: 'One source at a time', art: ART.superArt,
        html: `<p class="body">With two or more batteries, find what <b>each one does alone</b>, then <b>add</b> the results. That's <b>superposition</b>.</p><div class="def">To turn a battery "off" for this trick, <b>replace it with a plain wire</b> (0 V).<br><b>Example:</b> V1 alone makes X = 3 V. V2 alone makes X = 2 V. Together: <b>3 + 2 = 5 V</b>.</div>`, tip: 'This works for circuits made of batteries and resistors.' },
      { type: 'sim', kind: 'superpos', id: 'l31q1', graded: true, opts: ['5 V', '10 V', '2 V'], a: 0,
        q: 'Switch each battery off (replaced by a wire) to see what it does alone. Then pick node X\'s voltage with <b>both</b> on.', why: 'V1 alone gives 3 V (half of 6 V, since R1 = R2). V2 alone gives 2 V (half of 4 V). Superposition: 3 + 2 = 5 V, which is what the meter shows with both on.' },
      { type: 'mc', id: 'l31q2', q: 'Source 1 alone makes a node 2 V. Source 2 alone makes it 1.5 V. With both on, the node is…', opts: ['3.5 V', '0.5 V', '2 V'], a: 0, why: 'Add the separate effects: 2 + 1.5 = 3.5 V.' },
      { type: 'tf', id: 'l31q3', q: 'To "switch off" a battery for superposition, you replace it with a wire.', a: true, why: 'An off battery gives no push (0 V) but still lets current through, which is exactly what a plain wire does.' },
    ],
  },
  l32: {
    title: 'Thevenin equivalents', goal: 'Shrink a circuit down to one battery and one resistor.', cards: ['thev', 'vth', 'rth'],
    steps: [
      { type: 'concept', kicker: 'Big shortcut', title: 'Any circuit, two parts', art: ART.thevArt,
        html: `<p class="body">Seen from two terminals (a and b), any network of batteries and resistors acts just like <b>one battery V_Th in series with one resistor R_Th</b>. That's its <b>Thevenin equivalent</b> (after Léon Thévenin).</p><div class="def"><b>V_Th</b> = the voltage at a–b with <b>nothing connected</b>.<br><b>R_Th</b> = the resistance looking into a–b with every battery <b>replaced by a wire</b>.</div>` },
      { type: 'concept', kicker: 'Worked example', title: 'Thevenin of a divider', art: ART.thevArt,
        html: `<div class="def">12 V with two 6 kΩ resistors (output across the bottom one).<br><b>V_Th:</b> nothing connected, so it's a plain divider: 12 × 6 ÷ (6 + 6) = <b>6 V</b>.<br><b>R_Th:</b> replace the battery with a wire. Looking in, the two 6 kΩ are in parallel: 6 ∥ 6 = <b>3 kΩ</b>.</div>`, tip: 'Norton\'s version uses a current source in parallel instead, and "mesh analysis" is another loop method. Both come later.' },
      { type: 'sim', kind: 'thev', id: 'l32q1', graded: true, vin: 12, r1: 6, r2: 6,
        q: 'Set V_Th and R_Th so the simple circuit gives the <b>same load voltage</b> as the real one for every load, then press Check.', why: 'V_Th = 12 × 6 ÷ 12 = 6 V and R_Th = 6 kΩ ∥ 6 kΩ = 3 kΩ. With those, both circuits give identical load voltages, whatever load you connect.', answer: 'V_Th = 6 V, R_Th = 3 kΩ' },
      { type: 'mc', id: 'l32q2', q: 'A 10 V source feeds two 2 kΩ resistors as a divider. What is V_Th at the output?', opts: ['5 V', '10 V', '2 V'], a: 0, why: 'With nothing connected, it\'s just the divider: 10 × 2 ÷ 4 = 5 V.' },
      { type: 'tf', id: 'l32q3', q: 'V_Th is the voltage at the terminals when nothing is connected to them.', a: true, why: 'That\'s the open-circuit voltage, and it equals V_Th because no current flows through R_Th.' },
    ],
  },
});
